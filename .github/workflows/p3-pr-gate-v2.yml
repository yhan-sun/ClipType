name: P3 PR Gate V2

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/**"
      - "crates/**"
      - "assets/**"
      - "packaging/**"
      - ".github/workflows/p3-cross-platform.yml"
      - ".github/workflows/macos-release.yml"
      - ".github/workflows/p3-pr-gate-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-pr-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FEATURE_BRANCH: feat/p3-cross-platform-ui-macos

jobs:
  shared:
    name: Shared core, UI, tests, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require materialized source
        run: test -f crates/cliptype-macos/Cargo.toml && test -f apps/cliptype-macos/Cargo.toml
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Verify formatting and repository text
        run: |
          cargo fmt --all -- --check
          git diff --check
      - name: Check shared crates
        run: cargo check --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app -p cliptype-ui
      - name: Test shared crates
        run: cargo test -p cliptype-core -p cliptype-platform -p cliptype-app -p cliptype-ui
      - name: Lint shared crates
        run: cargo clippy --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app -p cliptype-ui -- -D warnings

  windows:
    name: Windows workspace
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require materialized source
        shell: pwsh
        run: |
          if (-not (Test-Path crates/cliptype-macos/Cargo.toml)) { throw "macOS source not materialized" }
      - name: Install pinned Rust
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  macos:
    name: macOS ${{ matrix.arch }} workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15-arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require materialized source
        run: test -f crates/cliptype-macos/Cargo.toml && test -f apps/cliptype-macos/Cargo.toml
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component clippy \
            --target ${{ matrix.target }}
      - name: Check workspace
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}
      - name: Test workspace
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build release app
        run: cargo build --release -p cliptype-macos-app --target ${{ matrix.target }}
      - name: Stage executable
        run: |
          mkdir -p artifact
          cp target/${{ matrix.target }}/release/cliptype-macos artifact/cliptype-macos-${{ matrix.arch }}
      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-v2-cliptype-macos-${{ matrix.arch }}
          path: artifact/cliptype-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 2

  universal:
    name: Universal 2 executable
    needs: macos
    runs-on: macos-15-arm64
    timeout-minutes: 15
    steps:
      - name: Download arm64 executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p3-v2-cliptype-macos-arm64
          path: input/arm64
      - name: Download Intel executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p3-v2-cliptype-macos-x86_64
          path: input/x86_64
      - name: Create and verify Universal 2 binary
        run: |
          mkdir -p output
          lipo -create \
            input/arm64/cliptype-macos-arm64 \
            input/x86_64/cliptype-macos-x86_64 \
            -output output/cliptype-macos
          lipo -verify_arch arm64 x86_64 output/cliptype-macos
          lipo -info output/cliptype-macos

  prove-and-open:
    name: Record green proof and open P3 implementation PR
    needs: [shared, windows, macos, universal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Record immutable green proof
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .github/p3-green
          cat > .github/p3-green/platform-gate.txt <<EOF
          verified_sha=${VERIFIED_SHA}
          workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          shared=success
          windows=success
          macos_arm64=success
          macos_x86_64=success
          universal2=success
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/p3-green/platform-gate.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(p3): record green cross-platform gate"
            git push origin HEAD:${FEATURE_BRANCH}
          fi
      - name: Create or update implementation PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$FEATURE_BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          cat >"$body_file" <<'EOF'
          ## Summary

          Implements the P3 cross-platform product slice:

          - shared native Slint settings UI;
          - versioned settings and transactional custom trigger/cancel shortcuts;
          - Windows live shortcut replacement with native registration probing;
          - macOS clipboard, target, Unicode keyboard, paste, permission, login-item, shortcut, and menu-bar adapters;
          - macOS menu-bar composition root;
          - Universal 2 build and packaging automation;
          - protected signed/notarized macOS release workflow.

          ## Safety and privacy invariants

          - clipboard plaintext is not persisted or logged;
          - no global key logger or low-level keyboard hook is introduced;
          - target identity remains content-blind;
          - shortcut replacement is all-or-nothing and preserves the prior live pair on failure;
          - Accessibility prompting requires explicit user action;
          - public signed/notarized release remains gated on protected maintainer credentials.

          ## Automated gate

          The implementation commit passed shared Rust/UI checks, the complete Windows workspace, native arm64 macOS, native Intel macOS, and Universal 2 `lipo` verification before this PR was opened. The immutable proof is committed at `.github/p3-green/platform-gate.txt`.

          ## Manual release validation still required

          - controlled Accessibility authorization/revocation on a maintainer Mac;
          - focus-change and Secure Event Input behavior in representative applications;
          - Developer ID signing, notarization, stapling, and Gatekeeper assessment with protected credentials.
          EOF
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --title "P3: cross-platform settings UI and macOS menu-bar app" \
              --body-file "$body_file"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$FEATURE_BRANCH" \
              --title "P3: cross-platform settings UI and macOS menu-bar app" \
              --body-file "$body_file"
          fi
