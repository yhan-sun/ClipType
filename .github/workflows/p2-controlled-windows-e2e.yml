name: P2 Controlled Windows E2E

on:
  pull_request:
    paths:
      - "apps/cliptype/**"
      - "crates/cliptype-*/**"
      - ".github/workflows/p2-controlled-windows-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "apps/cliptype/**"
      - "crates/cliptype-*/**"
      - ".github/workflows/p2-controlled-windows-e2e.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLIPTYPE_RUN_P2_CONTROLLED_E2E: "1"

jobs:
  controlled-product-paths:
    name: Keyboard, clipboard, auto, and clipboard preservation
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build P2 controlled E2E harness
        run: cargo build --locked -p cliptype --example p2_controlled_e2e
      - name: Execute three isolated product-path repetitions
        shell: pwsh
        run: |
          $log = "p2-controlled-e2e.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          1..3 | ForEach-Object {
            if ($_ -gt 1) {
              # Windows clipboard ownership can be released asynchronously
              # across short-lived processes. Preserve process isolation while
              # giving the OS a bounded quiescence interval between fixtures.
              Start-Sleep -Milliseconds 500
            }
            $output = cargo run --locked --quiet -p cliptype --example p2_controlled_e2e 2>&1
            $code = $LASTEXITCODE
            $output | Tee-Object -FilePath $log -Append
            if ($code -ne 0) {
              exit $code
            }
          }

          $successes = (Select-String -Path $log -SimpleMatch "p2_controlled_e2e result=ok").Count
          if ($successes -ne 12) {
            throw "expected twelve content-free P2 success records"
          }

          $expected = @{
            "case=keyboard backend=Keyboard" = 3
            "case=clipboard backend=Clipboard" = 3
            "case=auto-short backend=Keyboard" = 3
            "case=auto-long backend=Clipboard" = 3
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $count = (Select-String -Path $log -SimpleMatch $entry.Key).Count
            if ($count -ne $entry.Value) {
              throw "unexpected backend selection evidence for $($entry.Key): $count"
            }
          }

          $unchanged = (Select-String -Path $log -SimpleMatch "clipboard_unchanged=true").Count
          if ($unchanged -ne 12) {
            throw "the current clipboard was not preserved in every P2 case"
          }
          if (Select-String -Path $log -SimpleMatch "CLIPTYPE_P2_E2E_PRIVATE_SENTINEL_9265" -Quiet) {
            throw "P2 privacy sentinel escaped into ordinary output"
          }
