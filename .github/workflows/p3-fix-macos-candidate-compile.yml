name: P3 One-Time macOS Candidate Compile Fix

on:
  push:
    branches: [fix/p3-macos-candidate-compile-8c52a74]
    paths: [".github/workflows/p3-fix-macos-candidate-compile.yml"]

permissions:
  contents: write

jobs:
  patch:
    name: Apply minimal reviewed macOS compile fix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch, format, verify scope, and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8c52a74b5ab89ba8fd40ed91c54b5f7bd4270e73"
          python3 - <<'PY'
          from pathlib import Path

          main = Path('apps/cliptype-macos/src/main.rs')
          text = main.read_text(encoding='utf-8')
          old = "        const fn label(self) -> &'static str {"
          new = "        pub(super) const fn label(self) -> &'static str {"
          if text.count(old) != 1:
              raise RuntimeError('unexpected HostError::label source')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          native = Path('crates/cliptype-macos/src/native.rs')
          text = native.read_text(encoding='utf-8')
          old = "    sync::{\n        Arc,\n        atomic::{AtomicBool, Ordering},"
          new = "    sync::{\n        atomic::{AtomicBool, Ordering},"
          if text.count(old) != 1:
              raise RuntimeError('unexpected Arc import source')
          native.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          git rm .github/workflows/p3-fix-macos-candidate-compile.yml
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          printf '%s\n' "${changed[@]}"
          [[ ${#changed[@]} -eq 3 ]]
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'FILES'
          .github/workflows/p3-fix-macos-candidate-compile.yml
          apps/cliptype-macos/src/main.rs
          crates/cliptype-macos/src/native.rs
          FILES
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(p3): restore macOS candidate compilation"
          git push origin HEAD:fix/p3-macos-candidate-compile-8c52a74
