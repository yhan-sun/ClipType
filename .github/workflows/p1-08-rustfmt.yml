name: P1-08 Rustfmt

on:
  push:
    branches:
      - feat/p1-08-coordinator

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p1-08-coordinator
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/cliptype-app/src crates/cliptype-app/tests
          git commit -m "style: apply rustfmt to P1-08 tests"
          git push origin HEAD:feat/p1-08-coordinator
