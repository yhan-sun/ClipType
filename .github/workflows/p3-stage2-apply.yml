name: P3 Stage 2 Apply And Verify

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-stage2-apply.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-and-verify:
    name: Apply macOS adapters, app, packaging, and CI
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Apply staged macOS implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/p3-stage2.tar.gz').write_bytes(base64.b64decode(Path('.github/p3-stage2/payload.b64').read_text()))
          PY
          tar -xzf /tmp/p3-stage2.tar.gz
          chmod +x packaging/macos/package.sh
          python - <<'PY'
          from pathlib import Path
          cargo = Path('apps/cliptype-macos/Cargo.toml')
          text = cargo.read_text().replace('name = "cliptype-macos"\n', 'name = "cliptype-macos-app"\n', 1)
          if '[[bin]]' not in text:
              text += '\n[[bin]]\nname = "cliptype-macos"\npath = "src/main.rs"\n'
          cargo.write_text(text)
          native = Path('crates/cliptype-macos/native/cliptype_macos.m')
          text = native.read_text()
          text = text.replace('int ct_macos_post_unicode(const uint16_t *units, size_t length) {\nint ct_macos_post_unicode(const uint16_t *units, size_t length) {\n', 'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n')
          text = text.replace('        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n', '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n')
          native.write_text(text)
          for workflow in [Path('.github/workflows/p3-cross-platform.yml'), Path('.github/workflows/macos-release.yml')]:
              text = workflow.read_text()
              text = text.replace('-p cliptype-macos --target', '-p cliptype-macos-app --target')
              text = text.replace('runner: macos-15\n            target: x86_64-apple-darwin', 'runner: macos-15-intel\n            target: x86_64-apple-darwin')
              text = text.replace('runs-on: macos-15\n    timeout-minutes: 20', 'runs-on: macos-15-intel\n    timeout-minutes: 20')
              text = text.replace('--repo "$GITHUB_REPOSITORY" --clobber=false', '--repo "$GITHUB_REPOSITORY"')
              workflow.write_text(text)
          PY
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target x86_64-apple-darwin
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Check, test, and lint workspace on macOS Intel
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-check.log
          cargo test --workspace --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-test.log
          cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings 2>&1 | tee /tmp/macos-clippy.log
      - name: Build macOS composition root
        run: cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-macos-stage2-diagnostics
          path: /tmp/macos-*.log
          if-no-files-found: warn
          retention-days: 1
      - name: Remove one-time staging files
        run: |
          git rm -rf .github/p3-stage2
          git rm .github/workflows/p3-stage2-apply.yml
      - name: Commit verified macOS implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P3: add macOS adapters, menu-bar app, and Universal 2 CI"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
