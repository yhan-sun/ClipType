name: P3 macOS Release Hotfix

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
    paths:
      - ".github/workflows/p3-macos-release-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    name: Apply reviewed macOS release blockers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out P3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply minimal fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("apps/cliptype-macos/src/main.rs")
          text = main.read_text(encoding="utf-8")
          old = "        const fn label(self) -> &'static str {"
          new = "        pub(super) const fn label(self) -> &'static str {"
          if old not in text:
              raise SystemExit("HostError::label visibility marker not found")
          main.write_text(text.replace(old, new, 1), encoding="utf-8")

          native = Path("crates/cliptype-macos/src/native.rs")
          text = native.read_text(encoding="utf-8")
          old = "    sync::{\n        Arc,\n        atomic::{AtomicBool, Ordering},"
          new = "    sync::{\n        atomic::{AtomicBool, Ordering},"
          if old not in text:
              raise SystemExit("unused Arc import marker not found")
          native.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/p3-real-host-evidence.yml")
          text = workflow.read_text(encoding="utf-8")
          marker = "      - name: Verify repository release inputs without signing\n        run: >-\n"
          replacement = (
              "      - name: Remove test-generated bytecode before clean-tree preflight\n"
              "        shell: bash\n"
              "        run: find scripts -type d -name __pycache__ -prune -exec rm -rf {} +\n"
              "      - name: Verify repository release inputs without signing\n"
              "        run: >-\n"
          )
          if marker not in text:
              raise SystemExit("release preflight insertion marker not found")
          workflow.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
          rm .github/workflows/p3-macos-release-hotfix.yml
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all -- --check
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            apps/cliptype-macos/src/main.rs \
            crates/cliptype-macos/src/native.rs \
            .github/workflows/p3-real-host-evidence.yml \
            .github/workflows/p3-macos-release-hotfix.yml
          git commit -m "fix(p3): unblock macOS build and release preflight"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
