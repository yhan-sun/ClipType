name: P3 Stage 2 Recovery And Verify

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
    paths:
      - ".github/workflows/p3-stage2-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: p3-stage2-recovery
  cancel-in-progress: true

jobs:
  recover-and-verify:
    name: Recover, verify, and commit macOS implementation
    runs-on: macos-15-arm64
    timeout-minutes: 55
    steps:
      - name: Check out exact P3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0

      - name: Reconstruct and validate staged implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.github/p3-stage2')
          pieces = [
              path for path in sorted(root.glob('chunk-*.b64'))
              if path.name != 'chunk-02.b64'
          ]
          expected_names = [
              'chunk-00.b64',
              'chunk-01.b64',
              'chunk-02a.b64',
              'chunk-02b.b64',
              'chunk-02c.b64',
              'chunk-02d.b64',
              'chunk-03.b64',
              'chunk-04.b64',
              'chunk-05.b64',
              'chunk-06.b64',
              'chunk-07.b64',
          ]
          names = [path.name for path in pieces]
          if names != expected_names:
              raise SystemExit(f'unexpected payload pieces: {names}')

          parts = []
          for path in pieces:
              text = path.read_text(encoding='ascii').strip()
              if not text:
                  raise SystemExit(f'empty payload piece: {path.name}')
              if any(character not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=' for character in text):
                  raise SystemExit(f'non-Base64 character in {path.name}')
              parts.append(text)

          tail = (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )
          encoded = ''.join(parts) + tail
          if len(encoded) != 28116:
              raise SystemExit(f'payload Base64 length mismatch: got {len(encoded)}')

          encoded_digest = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          expected_encoded_digest = '8f8b42b20fe1ec0a47052992f78ff8705e343cf76947f07b6fe676d6960460a3'
          if encoded_digest != expected_encoded_digest:
              raise SystemExit(
                  'payload Base64 SHA-256 mismatch: '
                  f'expected {expected_encoded_digest}, got {encoded_digest}'
              )

          payload = base64.b64decode(encoded, validate=True)
          payload_digest = hashlib.sha256(payload).hexdigest()
          expected_payload_digest = 'a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9'
          if payload_digest != expected_payload_digest:
              raise SystemExit(
                  'payload SHA-256 mismatch: '
                  f'expected {expected_payload_digest}, got {payload_digest}'
              )

          Path('/tmp/p3-stage2.tar.gz').write_bytes(payload)
          PY
          tar -tzf /tmp/p3-stage2.tar.gz | tee /tmp/p3-stage2-members.txt
          tar -xzf /tmp/p3-stage2.tar.gz
          chmod +x packaging/macos/package.sh

      - name: Normalize staged source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cargo = Path('apps/cliptype-macos/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text = text.replace(
              'name = "cliptype-macos"\n',
              'name = "cliptype-macos-app"\n',
              1,
          )
          if '[[bin]]' not in text:
              text += '\n[[bin]]\nname = "cliptype-macos"\npath = "src/main.rs"\n'
          cargo.write_text(text, encoding='utf-8')

          native = Path('crates/cliptype-macos/native/cliptype_macos.m')
          text = native.read_text(encoding='utf-8')
          text = text.replace(
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
          )
          text = text.replace(
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
          )
          native.write_text(text, encoding='utf-8')

          for workflow in [
              Path('.github/workflows/p3-cross-platform.yml'),
              Path('.github/workflows/macos-release.yml'),
          ]:
              text = workflow.read_text(encoding='utf-8')
              text = text.replace(
                  '-p cliptype-macos --target',
                  '-p cliptype-macos-app --target',
              )
              text = text.replace(
                  'runner: macos-15\n            target: x86_64-apple-darwin',
                  'runner: macos-15-intel\n            target: x86_64-apple-darwin',
              )
              text = text.replace(
                  'runs-on: macos-15\n    timeout-minutes: 20',
                  'runs-on: macos-15-intel\n    timeout-minutes: 20',
              )
              text = text.replace(
                  '--repo "$GITHUB_REPOSITORY" --clobber=false',
                  '--repo "$GITHUB_REPOSITORY"',
              )
              workflow.write_text(text, encoding='utf-8')
          PY

      - name: Install pinned Rust toolchain and targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.0 \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc
          rustup default 1.98.0

      - name: Format source and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Check, test, and lint on Apple Silicon
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target aarch64-apple-darwin 2>&1 | tee /tmp/macos-arm64-check.log
          cargo test --workspace --target aarch64-apple-darwin 2>&1 | tee /tmp/macos-arm64-test.log
          cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings 2>&1 | tee /tmp/macos-arm64-clippy.log

      - name: Cross-check Intel macOS and Windows
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-x64-check.log
          cargo check --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 | tee /tmp/windows-cross-check.log

      - name: Build both macOS architectures and validate Universal 2
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin
          mkdir -p target/universal2/release
          lipo -create \
            target/aarch64-apple-darwin/release/cliptype-macos \
            target/x86_64-apple-darwin/release/cliptype-macos \
            -output target/universal2/release/cliptype-macos
          lipo -verify_arch x86_64 arm64 target/universal2/release/cliptype-macos
          lipo -info target/universal2/release/cliptype-macos | tee /tmp/universal2-info.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-stage2-recovery-diagnostics
          path: |
            /tmp/p3-stage2-members.txt
            /tmp/macos-*.log
            /tmp/windows-cross-check.log
            /tmp/universal2-info.log
          if-no-files-found: warn
          retention-days: 2

      - name: Remove one-time staging automation
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf .github/p3-stage2
          git rm -f .github/workflows/p3-stage2-apply.yml
          git rm -f .github/workflows/p3-stage2-recovery.yml

      - name: Commit verified macOS implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "P3: add macOS adapters, menu-bar app, and Universal 2 CI"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
