name: P3 S01 Apply Evidence Tooling

on:
  push:
    branches:
      - validation/p3-s01-macos-native-evidence-8c52a74
    paths:
      - ".github/p3-s01-apply/**"
      - ".github/workflows/p3-s01-source-export.yml"

permissions:
  contents: write

env:
  PAYLOAD_SHA256: 87ce1889f42175796a3254cbc9e69070ed077ede71ef993ff3d5ec7715e694d8

jobs:
  apply:
    name: Materialize reviewed P3-S01 evidence tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply exact reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.github/p3-s01-apply/chunk-*.b64)
          if [[ ${#chunks[@]} -eq 0 ]]; then
            echo "payload already consumed"
            exit 0
          fi
          cat "${chunks[@]}" | base64 --decode > /tmp/p3-s01-payload.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/p3-s01-payload.tar.gz | sha256sum --check --strict
          rm -rf /tmp/p3-s01-tree
          mkdir -p /tmp/p3-s01-tree
          python3 - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive_path = Path('/tmp/p3-s01-payload.tar.gz')
          destination = Path('/tmp/p3-s01-tree')
          allowed = (
              'crates/cliptype-macos/examples/p3_s01_probe.rs',
              'docs/research/P3_MACOS_NATIVE_SPIKE.md',
              'docs/testing/P3_MACOS_INTERACTIVE_RUNBOOK.md',
              'tools/macos/',
          )
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk() or member.isdev():
                      raise RuntimeError(f'unsafe archive member: {member.name}')
                  if not any(member.name == item or member.name.startswith(item) for item in allowed):
                      raise RuntimeError(f'path outside allowed writes: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise RuntimeError(f'unsupported archive member: {member.name}')
              archive.extractall(destination, members=members, filter='data')
          PY
          cp -a /tmp/p3-s01-tree/. .
          chmod +x tools/macos/p3_s01_*.sh
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustfmt +1.98.0 crates/cliptype-macos/examples/p3_s01_probe.rs
          tools/macos/p3_s01_self_test.sh
          swiftc -parse tools/macos/p3_s01_target.swift
          rm -rf .github/p3-s01-apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            crates/cliptype-macos/examples/p3_s01_probe.rs \
            docs/research/P3_MACOS_NATIVE_SPIKE.md \
            docs/testing/P3_MACOS_INTERACTIVE_RUNBOOK.md \
            tools/macos \
            .github/p3-s01-apply
          git diff --cached --check
          git commit -m "test(p3-s01): add exact-SHA macOS evidence kit"
          git push origin HEAD:validation/p3-s01-macos-native-evidence-8c52a74
