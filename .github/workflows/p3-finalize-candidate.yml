name: P3 Finalize Candidate And Draft PR

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-finalize-candidate.yml"]
  workflow_dispatch:

concurrency:
  group: p3-finalize-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  finalize:
    name: Finalize macOS Universal 2 candidate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Assert production source is materialized
        run: |
          test -f crates/cliptype-macos/Cargo.toml
          test -f apps/cliptype-macos/Cargo.toml
          test -f crates/cliptype-ui/ui/settings.slint
          test -f packaging/macos/package.sh
          test -f .github/workflows/p3-cross-platform.yml
          test -f .github/workflows/macos-release.yml
      - name: Install pinned Rust toolchain and targets
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin --toolchain 1.98.0
      - name: Normalize generated source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo fmt --all
      - name: Native Apple Silicon check and tests
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets 2>&1 | tee /tmp/p3-final-native-check.log
          cargo test --workspace 2>&1 | tee /tmp/p3-final-native-test.log
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/p3-final-native-clippy.log
      - name: Intel check and both release builds
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/p3-final-intel-check.log
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-final-arm64-build.log
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin 2>&1 | tee /tmp/p3-final-intel-build.log
      - name: Create and verify Universal 2 binary
        shell: bash
        run: |
          set -euo pipefail
          lipo -create target/aarch64-apple-darwin/release/cliptype-macos target/x86_64-apple-darwin/release/cliptype-macos -output /tmp/cliptype-macos-universal
          archs="$(lipo -archs /tmp/cliptype-macos-universal)"
          echo "Universal architectures: $archs"
          [[ "$archs" == "arm64 x86_64" || "$archs" == "x86_64 arm64" ]]
          file /tmp/cliptype-macos-universal
      - name: Assemble unsigned macOS candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION=v0.2.0-beta.1 \
          ARM64_BINARY=target/aarch64-apple-darwin/release/cliptype-macos \
          X86_64_BINARY=target/x86_64-apple-darwin/release/cliptype-macos \
          OUTPUT_DIR="$RUNNER_TEMP/p3-package" \
          packaging/macos/package.sh
          test -d "$RUNNER_TEMP/p3-package/ClipType.app"
          find "$RUNNER_TEMP/p3-package" -maxdepth 3 -type f -print
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-final-candidate-diagnostics
          path: /tmp/p3-final-*.log
          if-no-files-found: warn
          retention-days: 1
      - name: Record exact candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/testing
          cat > docs/testing/P3_AUTOMATED_CANDIDATE.md <<EOF
          # P3 automated candidate evidence

          - Source commit before evidence commit: $GITHUB_SHA
          - Runner: macOS 15 Apple Silicon
          - Rust toolchain: 1.98.0
          - Shared Settings UI check/test/Clippy: PASS
          - Native macOS workspace check/test/Clippy: PASS
          - Intel macOS workspace cross-check: PASS
          - Apple Silicon release build: PASS
          - Intel release build: PASS
          - Universal 2 lipo validation: PASS
          - Unsigned .app/ZIP/DMG candidate assembly: PASS

          Hosted automation does not prove interactive Accessibility authorization, real foreground-target behavior, real global-shortcut conflict behavior in a logged-in desktop, Developer ID signing, notarization, stapling, or Gatekeeper acceptance.
          EOF
      - name: Commit evidence and remove one-time automation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/p3-finalize-candidate.yml
          git rm -f --ignore-unmatch .github/workflows/p3-candidate-gate.yml
          git rm -f --ignore-unmatch .github/workflows/p3-macos-autofix.yml
          git rm -f --ignore-unmatch .github/workflows/p3-normalize-source.yml
          git rm -f --ignore-unmatch .github/workflows/p3-open-pr-after-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P3: verify Universal 2 candidate and record evidence"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
      - name: Create or update Draft P3 implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$REPO" --head feat/p3-cross-platform-ui-macos --base main --state open --json number --jq '.[0].number // empty')"
          title="P3: cross-platform Settings UI, custom hotkeys, and macOS Universal 2"
          body_file="$(mktemp)"
          cat > "$body_file" <<'EOF'
          ## Scope

          - Shared native-compiled Slint Settings UI on Windows and macOS.
          - Recorded Trigger and Cancel shortcuts with native-neutral persistence.
          - Static validation, OS registration probing, atomic replacement, and rollback.
          - Live Windows shortcut updates without a global keyboard hook.
          - macOS clipboard, revision guard, Core Graphics input/paste, focus evidence, Accessibility permissions, login item, global hotkeys, and AppKit menu-bar shell.
          - Apple Silicon and Intel builds, Universal 2 validation, `.app`/ZIP/DMG packaging, and signing/notarization hooks.

          ## Automated evidence

          See `docs/testing/P3_AUTOMATED_CANDIDATE.md`.

          ## Remaining promotion gates

          - Unlocked-client Windows and macOS interactive testing.
          - Real Accessibility grant/revoke and System Settings flows.
          - Real shortcut conflict/replacement/rollback testing.
          - Developer ID signing, notarization, stapling, and Gatekeeper verification with protected Apple credentials.
          - Independent architecture, privacy, unsafe/FFI, and release review.

          Tracks #43, #44, #45, #46, #47, #48, #49, #50, and #51.
          EOF
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file "$body_file"
          else
            gh pr create --repo "$REPO" --base main --head feat/p3-cross-platform-ui-macos --draft --title "$title" --body-file "$body_file"
          fi
