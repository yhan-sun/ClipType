name: P3 Real Host Evidence Gate

on:
  pull_request:
    paths:
      - "scripts/p3_real_host_gate.py"
      - "scripts/p3_release_preflight.py"
      - "scripts/tests/test_p3_*.py"
      - "qa/p3-real-host-checks.json"
      - "qa/evidence/p3/**"
      - "docs/testing/p3-real-host-release-gate.md"
      - ".github/workflows/p3-real-host-evidence.yml"
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character commit SHA represented by every manifest
        required: false
        type: string
      evidence_glob:
        description: Repository-relative glob for content-blind evidence manifests
        required: true
        default: qa/evidence/p3/*.json
        type: string
      require_release:
        description: Require the signed/notarized release-macos manifest in addition to three real-host manifests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: p3-real-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contract:
    name: Evidence contract and release preflight tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile content-blind gate tooling
        run: >-
          python3 -m py_compile
          scripts/p3_real_host_gate.py
          scripts/p3_release_preflight.py
          scripts/tests/test_p3_real_host_gate.py
          scripts/tests/test_p3_release_preflight.py
      - name: Run gate unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_p3_*.py' -v
      - name: Validate the platform check catalog
        run: |
          set -euo pipefail
          for platform in windows-x86_64 macos-arm64 macos-x86_64 release-macos; do
            python3 scripts/p3_real_host_gate.py catalog --platform "$platform" > "/tmp/${platform}.checks"
            test -s "/tmp/${platform}.checks"
          done
      - name: Remove test-generated bytecode before clean-tree preflight
        shell: bash
        run: find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Verify repository release inputs without signing
        run: >-
          python3 scripts/p3_release_preflight.py
          --repo .
          --commit "$GITHUB_SHA"
          --require-clean
          --json-output /tmp/p3-release-preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-release-preflight-${{ github.sha }}
          path: /tmp/p3-release-preflight.json
          if-no-files-found: error
          retention-days: 14

  evidence:
    name: Verify exact-commit multi-host evidence
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
      EVIDENCE_GLOB: ${{ inputs.evidence_glob }}
      REQUIRE_RELEASE: ${{ inputs.require_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
      - name: Resolve evidence paths without shell evaluation
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_GLOB" <<'PY'
          import glob
          import os
          import sys
          from pathlib import Path, PurePosixPath

          pattern = sys.argv[1].replace('\\', '/')
          pure = PurePosixPath(pattern)
          if pure.is_absolute() or '..' in pure.parts:
              raise SystemExit('evidence_glob must be repository-relative and cannot traverse parents')
          matches = sorted(Path(path) for path in glob.glob(pattern, recursive=False))
          if not matches:
              raise SystemExit(f'no evidence manifests matched {pattern!r}')
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as stream:
              stream.write('paths<<P3_PATHS\n')
              for path in matches:
                  if not path.is_file() or path.suffix != '.json':
                      raise SystemExit(f'not a JSON evidence file: {path}')
                  stream.write(path.as_posix() + '\n')
              stream.write('P3_PATHS\n')
          PY
      - name: Verify every manifest and the complete platform set
        shell: bash
        env:
          MANIFEST_PATHS: ${{ steps.manifests.outputs.paths }}
        run: |
          set -euo pipefail
          manifests=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && manifests+=("$path")
          done <<< "$MANIFEST_PATHS"
          test "${#manifests[@]}" -gt 0
          args=(verify-set "${manifests[@]}" --expected-commit "$EXPECTED_COMMIT")
          if [[ "$REQUIRE_RELEASE" == "true" ]]; then
            args+=(--require-release)
          fi
          python3 scripts/p3_real_host_gate.py "${args[@]}"
          python3 scripts/p3_real_host_gate.py report "${manifests[@]}" --output /tmp/p3-real-host-evidence.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-real-host-evidence-${{ env.EXPECTED_COMMIT }}
          path: /tmp/p3-real-host-evidence.md
          if-no-files-found: error
          retention-days: 30
