name: P3 Commit Reviewed Source

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-commit-reviewed-source.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  commit-source:
    name: Verify and commit real P3 product source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconstruct exact reviewed macOS source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path('.github/p3-stage2')
          names = [
              'chunk-00.b64', 'chunk-01.b64',
              'chunk-02a.b64', 'chunk-02b.b64', 'chunk-02c.b64', 'chunk-02d.b64',
              'chunk-03.b64',
              'chunk-04a.b64', 'chunk-04b.b64', 'chunk-04c.b64', 'chunk-04d.b64',
              'chunk-05a.b64', 'chunk-05b.b64', 'chunk-05c.b64', 'chunk-05d.b64',
              'chunk-06.b64', 'chunk-07.b64',
          ]
          tail = (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )
          encoded = ''.join(''.join((root / name).read_text(encoding='ascii').split()) for name in names) + tail
          assert len(encoded) == 28116
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == '8f8b42b20fe1ec0a47052992f78ff8705e343cf76947f07b6fe676d6960460a3'
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == 'a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9'
          uncompressed = gzip.decompress(payload)
          assert hashlib.sha256(uncompressed).hexdigest() == '344ae75f5f289cca03b5a4448e0985dae5dcfd97ca2faa81c62a53c4bebaa61a'

          destination = Path('/tmp/p3-reviewed-tree')
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(uncompressed), mode='r:') as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk() or member.isdev():
                      raise RuntimeError(f'unsafe archive member: {member.name}')
                  if not (member.isdir() or member.isfile()):
                      raise RuntimeError(f'unsupported archive member: {member.name}')
                  if member.isfile():
                      stream = archive.extractfile(member)
                      if stream is None or len(stream.read()) != member.size:
                          raise RuntimeError(f'incomplete archive member: {member.name}')
              archive.extractall(destination, members=members, filter='data')
          print(f'extracted_members={len(members)}')
          PY
      - name: Install reviewed source without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/p3-reviewed-tree/Cargo.toml Cargo.toml
          rm -rf apps/cliptype-macos crates/cliptype-macos packaging/macos
          cp -a /tmp/p3-reviewed-tree/apps/cliptype-macos apps/
          cp -a /tmp/p3-reviewed-tree/crates/cliptype-macos crates/
          cp -a /tmp/p3-reviewed-tree/packaging/macos packaging/
          cp /tmp/p3-reviewed-tree/assets/branding/cliptype-status-template.svg assets/branding/
          chmod +x packaging/macos/package.sh
          python3 - <<'PY'
          from pathlib import Path
          rust = Path('crates/cliptype-macos/src/lib.rs')
          rust.write_text(rust.read_text(encoding='utf-8').replace('#![forbid(unsafe_code)]', '#![deny(unsafe_op_in_unsafe_fn)]'), encoding='utf-8')
          native = Path('crates/cliptype-macos/src/native.rs')
          native.write_text(native.read_text(encoding='utf-8').replace('\nextern "C" {\n', '\nunsafe extern "C" {\n'), encoding='utf-8')
          PY
          rm -rf .github/p3-stage2
          rm -f .github/scripts/materialize_p3.py
      - name: Install Linux UI dependencies and pinned Rust
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Format, resolve, check, test, and lint
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --workspace --all-targets --target x86_64-pc-windows-msvc
      - name: Commit only non-workflow product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git add apps/cliptype-macos crates/cliptype-macos
          git add assets/branding/cliptype-status-template.svg packaging/macos
          git add -u .github/p3-stage2 .github/scripts/materialize_p3.py
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git diff --cached --check
          git diff --cached --stat
          git commit -m "P3: add macOS adapters, menu-bar app, and packaging"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
