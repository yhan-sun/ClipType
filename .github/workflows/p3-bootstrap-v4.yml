name: P3 Final Gate Bootstrap

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
    paths:
      - ".github/workflows/p3-bootstrap-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p3-final-gate-bootstrap-v4
  cancel-in-progress: true

jobs:
  collapse:
    name: Remove superseded temporary gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0

      - name: Keep only the deterministic v4 final gate
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/p3-stage2-apply.yml \
            .github/workflows/p3-stage2-recovery.yml \
            .github/workflows/p3-stage2-recovery-v2.yml \
            .github/workflows/p3-pr-gate.yml \
            .github/workflows/p3-pr-gate-retry.yml \
            .github/workflows/p3-finalize-and-pr.yml \
            .github/workflows/p3-finalize-v2.yml \
            .github/workflows/p3-finalize-v3.yml \
            .github/workflows/p3-bootstrap-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Temporary gates are already collapsed"
            exit 0
          fi
          git commit -m "ci(p3): retain one deterministic final gate"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
