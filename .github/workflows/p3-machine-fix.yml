name: P3 Machine-applicable Rust Fixes

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths:
      - "apps/cliptype-macos/**"
      - "crates/cliptype-macos/**"
      - "crates/cliptype-ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/p3-machine-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p3-machine-fix
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FEATURE_BRANCH: feat/p3-cross-platform-ui-macos

jobs:
  fix:
    name: Apply only machine-applicable Rust fixes
    runs-on: macos-15-arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Skip until materialized source exists
        id: source
        shell: bash
        run: |
          if [[ -f crates/cliptype-macos/Cargo.toml && -f apps/cliptype-macos/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Rust
        if: steps.source.outputs.present == 'true'
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin
      - name: Apply compiler and Clippy machine suggestions
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          cargo fix \
            --workspace \
            --all-targets \
            --target aarch64-apple-darwin \
            --allow-dirty \
            --allow-staged \
            2>&1 | tee /tmp/p3-cargo-fix.log
          cargo clippy \
            --fix \
            --workspace \
            --all-targets \
            --target aarch64-apple-darwin \
            --allow-dirty \
            --allow-staged \
            -- -D warnings \
            2>&1 | tee /tmp/p3-clippy-fix.log
          cargo fmt --all
          exit 0
      - name: Require fixed tree to compile on both macOS architectures
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-arm-check-after-fix.log
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/p3-intel-check-after-fix.log
          git diff --check
      - name: Upload diagnostics on failure
        if: failure() && steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-machine-fix-diagnostics
          path: /tmp/p3-*.log
          if-no-files-found: warn
          retention-days: 2
      - name: Remove one-time fixer and commit verified fixes
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p3-machine-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(p3): apply verified machine-applicable macOS fixes"
          git push origin HEAD:${FEATURE_BRANCH}
