name: P3 Isolated Final Controller

on:
  push:
    branches:
      - automation/p3-source-export-v2
    paths:
      - ".github/workflows/p3-controller-v1.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  FEATURE_BRANCH: feat/p3-cross-platform-ui-macos
  CFLAGS_aarch64_apple_darwin: -fobjc-arc -fmodules -Wno-deprecated-declarations
  CFLAGS_x86_64_apple_darwin: -fobjc-arc -fmodules -Wno-deprecated-declarations

concurrency:
  group: p3-isolated-final-controller
  cancel-in-progress: false

jobs:
  verify-and-propose:
    name: Verify final P3 candidate and create implementation PR
    runs-on: macos-15-arm64
    timeout-minutes: 100
    steps:
      - name: Check out latest P3 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0

      - name: Cancel superseded temporary P3 runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$FEATURE_BRANCH" \
            --limit 100 \
            --json databaseId,name,status \
            --jq '.[] | select(.status == "in_progress" or .status == "queued") | select(.name | test("P3 (Deterministic|Native-Hardened|Self-Healing|Finalize|Stage 2|Verified Pull Request)")) | .databaseId' \
            | while read -r run_id; do
                [[ -n "$run_id" ]] || continue
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              done
          git fetch origin "$FEATURE_BRANCH"
          git reset --hard "origin/$FEATURE_BRANCH"

      - name: Recover hash-verified source when necessary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f crates/cliptype-macos/Cargo.toml && -f apps/cliptype-macos/Cargo.toml ]]; then
            echo "Using source already present on the candidate branch"
            exit 0
          fi
          test -d .github/p3-stage2
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.github/p3-stage2')
          names = [
              'chunk-00.b64', 'chunk-01.b64',
              'chunk-02a.b64', 'chunk-02b.b64',
              'chunk-02c.b64', 'chunk-02d.b64',
              'chunk-03.b64', 'chunk-04.b64', 'chunk-05.b64',
              'chunk-06.b64', 'chunk-07.b64',
          ]
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          parts = []
          for name in names:
              text = (root / name).read_text(encoding='ascii').strip()
              if not text or not set(text) <= alphabet:
                  raise SystemExit(f'invalid staged payload piece: {name}')
              parts.append(text)
          encoded = ''.join(parts) + (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )
          expected_encoded = '8f8b42b20fe1ec0a47052992f78ff8705e343cf76947f07b6fe676d6960460a3'
          expected_archive = 'a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9'
          if len(encoded) != 28116:
              raise SystemExit(f'payload Base64 length mismatch: {len(encoded)}')
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != expected_encoded:
              raise SystemExit('payload Base64 SHA-256 mismatch')
          payload = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(payload).hexdigest() != expected_archive:
              raise SystemExit('payload archive SHA-256 mismatch')
          Path('/tmp/p3-controller-stage2.tar.gz').write_bytes(payload)
          PY
          tar -tzf /tmp/p3-controller-stage2.tar.gz | tee /tmp/p3-controller-members.log
          tar -xzf /tmp/p3-controller-stage2.tar.gz
          chmod +x packaging/macos/package.sh

      - name: Normalize candidate source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          app_manifest = Path('apps/cliptype-macos/Cargo.toml')
          text = app_manifest.read_text(encoding='utf-8')
          text = text.replace('name = "cliptype-macos"\n', 'name = "cliptype-macos-app"\n', 1)
          if '[[bin]]' not in text:
              text += '\n[[bin]]\nname = "cliptype-macos"\npath = "src/main.rs"\n'
          app_manifest.write_text(text, encoding='utf-8')

          for root in [Path('crates/cliptype-macos'), Path('apps/cliptype-macos')]:
              for path in root.rglob('*.rs'):
                  text = path.read_text(encoding='utf-8')
                  text = re.sub(r'(?m)^(\s*)extern\s+"C"\s*\{', r'\1unsafe extern "C" {', text)
                  text = text.replace('#[no_mangle]', '#[unsafe(no_mangle)]')
                  path.write_text(text, encoding='utf-8')

          native = Path('crates/cliptype-macos/native/cliptype_macos.m')
          text = native.read_text(encoding='utf-8')
          duplicate_function = (
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
          )
          while duplicate_function in text:
              text = text.replace(
                  duplicate_function,
                  'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
              )
          duplicate_image = (
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
          )
          while duplicate_image in text:
              text = text.replace(
                  duplicate_image,
                  '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
              )
          native.write_text(text, encoding='utf-8')

          build = Path('crates/cliptype-macos/build.rs')
          text = build.read_text(encoding='utf-8')
          marker = 'fn main() {'
          if marker not in text:
              raise SystemExit('macOS build script has no main function')
          insertions = []
          if 'CARGO_CFG_TARGET_OS' not in text:
              insertions.extend([
                  '    if std::env::var("CARGO_CFG_TARGET_OS").as_deref() != Ok("macos") {',
                  '        return;',
                  '    }',
              ])
          for framework in ['AppKit', 'ApplicationServices', 'Carbon', 'ServiceManagement']:
              directive = f'cargo:rustc-link-lib=framework={framework}'
              if directive not in text:
                  insertions.append(f'    println!("cargo:rustc-link-lib=framework={framework}");')
          if insertions:
              text = text.replace(marker, marker + '\n' + '\n'.join(insertions), 1)
          build.write_text(text, encoding='utf-8')

          permanent = [
              Path('.github/workflows/p3-cross-platform.yml'),
              Path('.github/workflows/macos-release.yml'),
          ]
          for path in permanent:
              text = path.read_text(encoding='utf-8')
              text = text.replace('-p cliptype-macos --target', '-p cliptype-macos-app --target')
              text = text.replace(
                  'runner: macos-15\n            target: x86_64-apple-darwin',
                  'runner: macos-15-intel\n            target: x86_64-apple-darwin',
              )
              text = text.replace(
                  'runs-on: macos-15\n    timeout-minutes: 20',
                  'runs-on: macos-15-intel\n    timeout-minutes: 20',
              )
              text = text.replace('--repo "$GITHUB_REPOSITORY" --clobber=false', '--repo "$GITHUB_REPOSITORY"')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install Rust 1.98 and all validation targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.0 \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc
          rustup default 1.98.0

      - name: Install compiler diagnostic converger
        shell: bash
        run: |
          cat > /tmp/p3-converge.py <<'PY'
          import json
          import sys
          from collections import defaultdict
          from pathlib import Path

          root = Path.cwd().resolve()
          edits = defaultdict(list)

          def collect(message):
              if not isinstance(message, dict):
                  return
              for span in message.get('spans') or []:
                  replacement = span.get('suggested_replacement')
                  applicability = span.get('suggestion_applicability')
                  if replacement is None or applicability not in {'MachineApplicable', 'MaybeIncorrect'}:
                      continue
                  filename = span.get('file_name')
                  if not filename or filename.startswith('<'):
                      continue
                  path = Path(filename)
                  path = path.resolve() if path.is_absolute() else (root / path).resolve()
                  try:
                      path.relative_to(root)
                  except ValueError:
                      continue
                  if path.suffix != '.rs' or not path.is_file():
                      continue
                  start = span.get('byte_start')
                  end = span.get('byte_end')
                  if isinstance(start, int) and isinstance(end, int):
                      edits[path].append((start, end, replacement))
              for child in message.get('children') or []:
                  collect(child)

          for filename in sys.argv[1:]:
              with open(filename, encoding='utf-8', errors='replace') as handle:
                  for line in handle:
                      if not line.startswith('{'):
                          continue
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if event.get('reason') == 'compiler-message':
                          collect(event.get('message') or {})

          changed = 0
          for path, candidates in edits.items():
              original = path.read_bytes()
              occupied = []
              accepted = []
              for start, end, replacement in sorted(set(candidates), reverse=True):
                  if start < 0 or end < start or end > len(original):
                      continue
                  if any(not (end <= used_start or start >= used_end) for used_start, used_end in occupied):
                      continue
                  accepted.append((start, end, replacement.encode('utf-8')))
                  occupied.append((start, end))
              updated = original
              for start, end, replacement in sorted(accepted, reverse=True):
                  updated = updated[:start] + replacement + updated[end:]
              if updated != original:
                  path.write_bytes(updated)
                  changed += 1
                  print(f'updated {path.relative_to(root)}')
          print(f'changed_files={changed}')
          PY

      - name: Apply safe native and Rust fix-its
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx clang \
            -x objective-c -fobjc-arc -fmodules \
            -isysroot "$SDK_PATH" -arch arm64 \
            -fsyntax-only -Wno-deprecated-declarations \
            -Xclang -fixit \
            crates/cliptype-macos/native/cliptype_macos.m || true
          cargo fmt --all
          cargo generate-lockfile
          cargo fix --workspace --all-targets --target aarch64-apple-darwin \
            --allow-dirty --allow-staged --allow-no-vcs --broken-code || true
          cargo clippy --fix --workspace --all-targets --target aarch64-apple-darwin \
            --allow-dirty --allow-staged --allow-no-vcs --broken-code -- -D warnings || true

          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            for attempt in 1 2 3 4; do
              log="/tmp/p3-controller-${target}-${attempt}.jsonl"
              if cargo check --workspace --all-targets --target "$target" \
                --message-format=json-diagnostic-rendered-ansi >"$log" 2>&1; then
                break
              fi
              python /tmp/p3-converge.py "$log"
              cargo fmt --all || true
            done
          done
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Objective-C syntax hard gate
        shell: bash
        run: |
          set -o pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx clang \
            -x objective-c -fobjc-arc -fmodules \
            -isysroot "$SDK_PATH" -arch arm64 \
            -fsyntax-only -Wall -Wextra \
            -Wno-deprecated-declarations -Wno-unused-parameter \
            crates/cliptype-macos/native/cliptype_macos.m \
            2>&1 | tee /tmp/p3-controller-objc.log

      - name: Native Apple Silicon check, tests, and lint
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-controller-arm64-check.log
          cargo test --workspace --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-controller-arm64-test.log
          cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings 2>&1 | tee /tmp/p3-controller-arm64-clippy.log

      - name: Intel macOS and Windows MSVC cross-checks
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/p3-controller-x64-check.log
          cargo check --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 | tee /tmp/p3-controller-windows-check.log

      - name: Universal 2 release hard gate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin
          mkdir -p target/universal2/release
          lipo -create \
            target/aarch64-apple-darwin/release/cliptype-macos \
            target/x86_64-apple-darwin/release/cliptype-macos \
            -output target/universal2/release/cliptype-macos
          lipo -verify_arch arm64 x86_64 target/universal2/release/cliptype-macos
          lipo -info target/universal2/release/cliptype-macos | tee /tmp/p3-controller-universal2.log

      - name: Upload isolated-controller diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-isolated-final-controller-diagnostics
          path: |
            /tmp/p3-controller-*.log
            /tmp/p3-controller-*.jsonl
          if-no-files-found: warn
          retention-days: 5

      - name: Persist safe corrections if a hard gate fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps crates packaging .github/workflows/p3-cross-platform.yml .github/workflows/macos-release.yml
          if git diff --cached --quiet; then
            echo "No validated automatic correction is available to persist"
          else
            git commit -m "fix(p3): persist isolated-controller corrections"
            git push origin HEAD:"$FEATURE_BRANCH"
          fi

      - name: Remove staging and temporary feature-branch workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch .github/p3-stage2
          git rm -f --ignore-unmatch \
            .github/workflows/p3-stage2-apply.yml \
            .github/workflows/p3-stage2-recovery.yml \
            .github/workflows/p3-stage2-recovery-v2.yml \
            .github/workflows/p3-pr-gate.yml \
            .github/workflows/p3-pr-gate-retry.yml \
            .github/workflows/p3-finalize-and-pr.yml \
            .github/workflows/p3-finalize-v2.yml \
            .github/workflows/p3-finalize-v3.yml \
            .github/workflows/p3-final-v4.yml \
            .github/workflows/p3-pr-opener.yml \
            .github/workflows/p3-bootstrap-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Candidate already has only production files"
          else
            git diff --cached --stat
            git commit -m "P3: add macOS adapters, menu-bar app, and Universal 2 CI"
          fi
          git push origin HEAD:"$FEATURE_BRANCH"

      - name: Create or update P3 implementation PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/p3-controller-pr.md <<'EOF'
          ## Summary

          - shared Slint settings UI and versioned settings persistence
          - transactional custom trigger/cancel hotkeys with live Win32 replacement
          - native macOS clipboard, Unicode keyboard, paste, target, permission, and global-hotkey adapters
          - AppKit menu-bar host and launch-at-login integration
          - Universal 2 packaging and protected signing/notarization release gates

          ## Automated verification

          - Objective-C native-source syntax validation
          - native Apple Silicon workspace check, tests, and Clippy with warnings denied
          - Intel macOS full workspace cross-check
          - Windows MSVC full workspace cross-check
          - arm64 and x86_64 release builds combined and verified with `lipo`

          ## Release boundary

          Developer ID signing and Apple notarization require protected maintainer credentials. Pull-request CI validates unsigned candidates and does not claim notarization.
          EOF
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$FEATURE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$FEATURE_BRANCH" \
              --title "P3: shared settings UI, custom hotkeys, and macOS support" \
              --body-file /tmp/p3-controller-pr.md
          else
            gh pr edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --title "P3: shared settings UI, custom hotkeys, and macOS support" \
              --body-file /tmp/p3-controller-pr.md
            echo "Updated existing P3 implementation PR #$existing"
          fi
