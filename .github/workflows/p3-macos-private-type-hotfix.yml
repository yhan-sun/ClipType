name: P3 macOS Private Type Hotfix

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
    paths:
      - ".github/workflows/p3-macos-private-type-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply restricted parent-module visibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/cliptype-macos/src/main.rs")
          text = path.read_text(encoding="utf-8")
          old = "    enum HostError {"
          new = "    pub(super) enum HostError {"
          if text.count(old) != 1:
              raise SystemExit("HostError visibility marker not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all -- --check
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/cliptype-macos/src/main.rs
          git commit -m "fix(p3): expose host error to composition root"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
