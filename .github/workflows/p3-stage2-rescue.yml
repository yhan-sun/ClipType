name: P3 Stage 2 Rescue And Verify

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-stage2-rescue.yml"]
  workflow_dispatch:

concurrency:
  group: p3-stage2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rescue:
    name: Idempotently apply and verify the macOS stage
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Detect whether rescue is still needed
        id: needed
        shell: bash
        run: |
          if [[ -f .github/p3-stage2/payload.b64 ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "Verified source stage is already committed; rescue is a no-op."
          fi
      - name: Apply staged source with Python standard libraries
        if: steps.needed.outputs.value == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, tarfile
          from pathlib import Path
          encoded = ''.join(Path('.github/p3-stage2/payload.b64').read_text(encoding='ascii').split())
          archive = Path('/tmp/p3-stage2.tar.gz')
          archive.write_bytes(base64.b64decode(encoded, validate=True))
          with tarfile.open(archive, 'r:gz') as bundle:
              bundle.extractall('.')
          PY
          chmod +x packaging/macos/package.sh
      - name: Normalize staged source
        if: steps.needed.outputs.value == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('apps/cliptype-macos/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text = text.replace('name = "cliptype-macos"\n', 'name = "cliptype-macos-app"\n', 1)
          if '[[bin]]' not in text:
              text += '\n[[bin]]\nname = "cliptype-macos"\npath = "src/main.rs"\n'
          cargo.write_text(text, encoding='utf-8')

          native = Path('crates/cliptype-macos/native/cliptype_macos.m')
          text = native.read_text(encoding='utf-8')
          while 'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\nint ct_macos_post_unicode(const uint16_t *units, size_t length) {' in text:
              text = text.replace(
                  'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\nint ct_macos_post_unicode(const uint16_t *units, size_t length) {',
                  'int ct_macos_post_unicode(const uint16_t *units, size_t length) {',
              )
          while '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"' in text:
              text = text.replace(
                  '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"',
                  '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"',
              )
          native.write_text(text, encoding='utf-8')

          for workflow in [Path('.github/workflows/p3-cross-platform.yml'), Path('.github/workflows/macos-release.yml')]:
              text = workflow.read_text(encoding='utf-8')
              text = text.replace('-p cliptype-macos --target', '-p cliptype-macos-app --target')
              text = text.replace('runner: macos-15\n            target: x86_64-apple-darwin', 'runner: macos-15-intel\n            target: x86_64-apple-darwin')
              text = text.replace('runs-on: macos-15\n    timeout-minutes: 20', 'runs-on: macos-15-intel\n    timeout-minutes: 20')
              text = text.replace('--repo "$GITHUB_REPOSITORY" --clobber=false', '--repo "$GITHUB_REPOSITORY"')
              workflow.write_text(text, encoding='utf-8')
          PY
      - name: Install Rust targets
        if: steps.needed.outputs.value == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin --toolchain 1.98.0
      - name: Refresh generated files and apply machine suggestions
        if: steps.needed.outputs.value == 'true'
        shell: bash
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo fmt --all
      - name: Verify native workspace
        if: steps.needed.outputs.value == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets 2>&1 | tee /tmp/macos-native-check.log
          cargo test --workspace 2>&1 | tee /tmp/macos-native-test.log
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/macos-native-clippy.log
      - name: Verify Intel workspace and both release binaries
        if: steps.needed.outputs.value == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-intel-check.log
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin 2>&1 | tee /tmp/macos-arm64-build.log
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-intel-build.log
          lipo -create target/aarch64-apple-darwin/release/cliptype-macos target/x86_64-apple-darwin/release/cliptype-macos -output /tmp/cliptype-macos-universal
          archs="$(lipo -archs /tmp/cliptype-macos-universal)"
          [[ "$archs" == "arm64 x86_64" || "$archs" == "x86_64 arm64" ]]
      - name: Upload focused diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-macos-stage2-rescue-diagnostics
          path: /tmp/macos-*.log
          if-no-files-found: warn
          retention-days: 1
      - name: Commit verified source and remove all staging automation
        if: steps.needed.outputs.value == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm -rf .github/p3-stage2
          git rm -f .github/workflows/p3-stage2-apply.yml
          git rm -f .github/workflows/p3-stage2-rescue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P3: add macOS adapters, menu-bar app, and Universal 2 CI"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
