name: P3 Self-Healing Final Gate

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: p3-stage2-recovery
  cancel-in-progress: true

jobs:
  finalize:
    name: Recover, converge, verify, and propose P3
    runs-on: macos-15-arm64
    timeout-minutes: 75
    steps:
      - name: Check out exact P3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0

      - name: Recover production source when needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f crates/cliptype-macos/Cargo.toml && -f apps/cliptype-macos/Cargo.toml ]]; then
            echo "Production macOS source is already present"
            exit 0
          fi
          test -d .github/p3-stage2
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.github/p3-stage2')
          names = [
              'chunk-00.b64', 'chunk-01.b64',
              'chunk-02a.b64', 'chunk-02b.b64',
              'chunk-02c.b64', 'chunk-02d.b64',
              'chunk-03.b64', 'chunk-04.b64', 'chunk-05.b64',
              'chunk-06.b64', 'chunk-07.b64',
          ]
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          parts = []
          for name in names:
              text = (root / name).read_text(encoding='ascii').strip()
              if not text:
                  raise SystemExit(f'empty payload piece: {name}')
              if not set(text) <= alphabet:
                  raise SystemExit(f'non-Base64 character in payload piece: {name}')
              parts.append(text)

          encoded = ''.join(parts) + (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )
          expected_length = 28116
          expected_encoded_sha256 = '8f8b42b20fe1ec0a47052992f78ff8705e343cf76947f07b6fe676d6960460a3'
          expected_payload_sha256 = 'a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9'
          if len(encoded) != expected_length:
              raise SystemExit(
                  f'payload Base64 length mismatch: expected {expected_length}, got {len(encoded)}'
              )
          encoded_sha256 = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if encoded_sha256 != expected_encoded_sha256:
              raise SystemExit(
                  f'payload Base64 SHA-256 mismatch: expected {expected_encoded_sha256}, got {encoded_sha256}'
              )
          payload = base64.b64decode(encoded, validate=True)
          payload_sha256 = hashlib.sha256(payload).hexdigest()
          if payload_sha256 != expected_payload_sha256:
              raise SystemExit(
                  f'payload SHA-256 mismatch: expected {expected_payload_sha256}, got {payload_sha256}'
              )
          Path('/tmp/p3-stage2.tar.gz').write_bytes(payload)
          PY
          tar -tzf /tmp/p3-stage2.tar.gz | tee /tmp/p3-v2-members.log
          tar -xzf /tmp/p3-stage2.tar.gz
          chmod +x packaging/macos/package.sh

      - name: Normalize staged source and permanent workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest = Path('apps/cliptype-macos/Cargo.toml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('name = "cliptype-macos"\n', 'name = "cliptype-macos-app"\n', 1)
          if '[[bin]]' not in text:
              text += '\n[[bin]]\nname = "cliptype-macos"\npath = "src/main.rs"\n'
          manifest.write_text(text, encoding='utf-8')

          native = Path('crates/cliptype-macos/native/cliptype_macos.m')
          text = native.read_text(encoding='utf-8')
          duplicate_function = (
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
          )
          while duplicate_function in text:
              text = text.replace(
                  duplicate_function,
                  'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
              )
          duplicate_image = (
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
          )
          while duplicate_image in text:
              text = text.replace(
                  duplicate_image,
                  '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
              )
          native.write_text(text, encoding='utf-8')

          cross_platform = Path('.github/workflows/p3-cross-platform.yml')
          text = cross_platform.read_text(encoding='utf-8')
          text = text.replace('-p cliptype-macos --target', '-p cliptype-macos-app --target')
          text = text.replace(
              'runner: macos-15\n            target: x86_64-apple-darwin',
              'runner: macos-15-intel\n            target: x86_64-apple-darwin',
          )
          cross_platform.write_text(text, encoding='utf-8')

          release = Path('.github/workflows/macos-release.yml')
          text = release.read_text(encoding='utf-8')
          text = text.replace('-p cliptype-macos --target', '-p cliptype-macos-app --target')
          text = text.replace(
              'runs-on: macos-15\n    timeout-minutes: 20',
              'runs-on: macos-15-intel\n    timeout-minutes: 20',
          )
          text = text.replace(
              '--repo "$GITHUB_REPOSITORY" --clobber=false',
              '--repo "$GITHUB_REPOSITORY"',
          )
          release.write_text(text, encoding='utf-8')
          PY

      - name: Install Rust 1.98 and validation targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.0 \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc
          rustup default 1.98.0

      - name: Install compiler-suggestion applier
        shell: bash
        run: |
          cat > /tmp/apply-rust-suggestions.py <<'PY'
          import json
          import os
          import sys
          from collections import defaultdict
          from pathlib import Path

          root = Path.cwd().resolve()
          suggestions = defaultdict(list)

          def visit_message(message):
              if not isinstance(message, dict):
                  return
              for span in message.get('spans') or []:
                  replacement = span.get('suggested_replacement')
                  applicability = span.get('suggestion_applicability')
                  if replacement is None:
                      continue
                  if applicability not in {'MachineApplicable', 'MaybeIncorrect'}:
                      continue
                  filename = span.get('file_name')
                  if not filename or filename.startswith('<'):
                      continue
                  path = Path(filename)
                  if not path.is_absolute():
                      path = (root / path).resolve()
                  else:
                      path = path.resolve()
                  try:
                      path.relative_to(root)
                  except ValueError:
                      continue
                  if path.suffix != '.rs' or not path.is_file():
                      continue
                  start = span.get('byte_start')
                  end = span.get('byte_end')
                  if not isinstance(start, int) or not isinstance(end, int):
                      continue
                  suggestions[path].append((start, end, replacement))
              for child in message.get('children') or []:
                  visit_message(child)

          for log_name in sys.argv[1:]:
              with open(log_name, 'r', encoding='utf-8', errors='replace') as handle:
                  for line in handle:
                      line = line.strip()
                      if not line.startswith('{'):
                          continue
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if event.get('reason') == 'compiler-message':
                          visit_message(event.get('message') or {})

          changed = 0
          for path, edits in suggestions.items():
              original = path.read_bytes()
              accepted = []
              occupied = []
              for start, end, replacement in sorted(set(edits), reverse=True):
                  if start < 0 or end < start or end > len(original):
                      continue
                  if any(not (end <= other_start or start >= other_end) for other_start, other_end in occupied):
                      continue
                  accepted.append((start, end, replacement.encode('utf-8')))
                  occupied.append((start, end))
              if not accepted:
                  continue
              updated = original
              for start, end, replacement in sorted(accepted, reverse=True):
                  updated = updated[:start] + replacement + updated[end:]
              if updated != original:
                  path.write_bytes(updated)
                  changed += 1
                  print(f'applied compiler suggestions to {path.relative_to(root)}')
          print(f'changed_files={changed}')
          PY

      - name: Converge machine-applicable Rust diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo fix --workspace --all-targets --target aarch64-apple-darwin \
            --allow-dirty --allow-staged --allow-no-vcs --broken-code || true
          cargo clippy --fix --workspace --all-targets --target aarch64-apple-darwin \
            --allow-dirty --allow-staged --allow-no-vcs --broken-code -- -D warnings || true

          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            for attempt in 1 2 3; do
              log="/tmp/p3-v2-${target}-${attempt}.jsonl"
              if cargo check --workspace --all-targets --target "$target" \
                --message-format=json-diagnostic-rendered-ansi >"$log" 2>&1; then
                break
              fi
              python /tmp/apply-rust-suggestions.py "$log"
              cargo fmt --all || true
            done
          done
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Native Apple Silicon hard gate
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-v2-arm64-check.log
          cargo test --workspace --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-v2-arm64-test.log
          cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings 2>&1 | tee /tmp/p3-v2-arm64-clippy.log

      - name: Intel macOS and Windows hard gates
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/p3-v2-x64-check.log
          cargo check --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 | tee /tmp/p3-v2-windows-check.log

      - name: Universal 2 hard gate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin
          mkdir -p target/universal2/release
          lipo -create \
            target/aarch64-apple-darwin/release/cliptype-macos \
            target/x86_64-apple-darwin/release/cliptype-macos \
            -output target/universal2/release/cliptype-macos
          lipo -verify_arch arm64 x86_64 target/universal2/release/cliptype-macos
          lipo -info target/universal2/release/cliptype-macos | tee /tmp/p3-v2-universal2.log

      - name: Upload hard-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-self-healing-final-gate-diagnostics
          path: |
            /tmp/p3-v2-*.log
            /tmp/p3-v2-*.jsonl
          if-no-files-found: warn
          retention-days: 3

      - name: Commit compiler-guided changes after a failed gate
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps crates packaging .github/workflows/p3-cross-platform.yml .github/workflows/macos-release.yml
          if git diff --cached --quiet; then
            echo "No safe compiler-guided change is available to persist"
          else
            git commit -m "fix(p3): apply compiler-guided macOS corrections"
            git push origin HEAD:feat/p3-cross-platform-ui-macos
          fi

      - name: Commit verified production source
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch .github/p3-stage2
          git rm -f --ignore-unmatch \
            .github/workflows/p3-stage2-apply.yml \
            .github/workflows/p3-stage2-recovery.yml \
            .github/workflows/p3-stage2-recovery-v2.yml \
            .github/workflows/p3-pr-gate.yml \
            .github/workflows/p3-pr-gate-retry.yml \
            .github/workflows/p3-finalize-and-pr.yml \
            .github/workflows/p3-finalize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "P3: add macOS adapters, menu-bar app, and Universal 2 CI"
          git push origin HEAD:feat/p3-cross-platform-ui-macos

      - name: Open or report P3 implementation pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head feat/p3-cross-platform-ui-macos \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "P3 pull request already open: #$existing"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head feat/p3-cross-platform-ui-macos \
              --title "P3: shared settings UI, custom hotkeys, and macOS support" \
              --body "Implements the shared Slint settings UI, transactional custom hotkeys, native macOS adapters and AppKit menu-bar composition root, plus Universal 2 packaging and protected signing/notarization gates. Verified with native Apple Silicon tests and Clippy, Intel macOS and Windows MSVC cross-checks, and lipo architecture validation."
          fi
