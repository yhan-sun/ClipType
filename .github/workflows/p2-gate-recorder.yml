name: P2 Product Gate Recorder

on:
  push:
    branches:
      - feat/p2-windows-productization

permissions:
  actions: read
  contents: write

jobs:
  record-exact-head-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p2-windows-productization
          fetch-depth: 0

      - name: Wait for every standard P1/P2 workflow on this exact SHA
        id: gate
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import urllib.request
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          candidate = os.environ["CANDIDATE_SHA"]
          token = os.environ["GH_TOKEN"]

          def workflow_name(path: Path) -> str | None:
              for line in path.read_text(encoding="utf-8").splitlines():
                  match = re.match(r"^name:\s*(.+?)\s*$", line)
                  if match:
                      return match.group(1).strip('"\'')
              return None

          workflow_dir = Path(".github/workflows")
          paths = [workflow_dir / "ci.yml"]
          paths.extend(sorted(workflow_dir.glob("p1-*.yml")))
          paths.extend(sorted(workflow_dir.glob("p2-*.yml")))
          expected: set[str] = set()
          for path in paths:
              lower = path.name.lower()
              if not path.exists():
                  continue
              if "one-time" in lower or path.name == "p2-gate-recorder.yml":
                  continue
              text = path.read_text(encoding="utf-8")
              if "pull_request:" not in text and "push:" not in text:
                  continue
              name = workflow_name(path)
              if name and name != "P2 Product Gate Recorder":
                  expected.add(name)

          required = {
              "Rust CI",
              "P1 Windows Host Smoke",
              "P1 Windows Native Spike",
              "P2 Controlled Windows E2E",
              "P2 Backend Benchmark",
              "P2 Windows Package",
          }
          missing_files = required - expected
          if missing_files:
              raise SystemExit(f"required workflow definitions missing: {sorted(missing_files)}")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cliptype-p2-gate-recorder",
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          deadline = time.monotonic() + 30 * 60
          selected: dict[str, dict] = {}
          while time.monotonic() < deadline:
              payload = get_json(
                  f"https://api.github.com/repos/{repository}/actions/runs"
                  f"?head_sha={candidate}&per_page=100"
              )
              grouped: dict[str, list[dict]] = {}
              for run in payload.get("workflow_runs", []):
                  name = run.get("name")
                  if name in expected:
                      grouped.setdefault(name, []).append(run)

              selected = {}
              for name, runs in grouped.items():
                  selected[name] = max(
                      runs,
                      key=lambda run: (run.get("created_at", ""), run.get("id", 0)),
                  )

              absent = expected - selected.keys()
              incomplete = {
                  name
                  for name, run in selected.items()
                  if run.get("status") != "completed"
              }
              if not absent and not incomplete:
                  break
              print(
                  "waiting",
                  json.dumps(
                      {
                          "absent": sorted(absent),
                          "incomplete": sorted(incomplete),
                      },
                      sort_keys=True,
                  ),
              )
              time.sleep(15)
          else:
              raise SystemExit("timed out waiting for exact-head workflow matrix")

          failed = {
              name: run.get("conclusion")
              for name, run in selected.items()
              if run.get("conclusion") != "success"
          }
          if failed:
              raise SystemExit(f"exact-head gate failed: {failed}")

          rows = []
          for name in sorted(expected):
              run = selected[name]
              rows.append(
                  {
                      "name": name,
                      "run_id": run["id"],
                      "event": run.get("event", "unknown"),
                      "conclusion": run.get("conclusion", "unknown"),
                  }
              )
          Path("/tmp/p2-workflows.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"candidate_sha={candidate}\n")

      - name: Refuse to record a superseded candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.gate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch origin feat/p2-windows-productization
          remote_sha="$(git rev-parse origin/feat/p2-windows-productization)"
          if [[ "$remote_sha" != "$CANDIDATE_SHA" ]]; then
            echo "candidate superseded by $remote_sha; its own push will start a new recorder"
            exit 1
          fi

      - name: Write evidence and convert recorder to read-only consistency check
        shell: python
        env:
          CANDIDATE_SHA: ${{ steps.gate.outputs.candidate_sha }}
          RECORDER_RUN_ID: ${{ github.run_id }}
        run: |
          from pathlib import Path
          import json
          import os

          candidate = os.environ["CANDIDATE_SHA"]
          recorder = os.environ["RECORDER_RUN_ID"]
          rows = json.loads(Path("/tmp/p2-workflows.json").read_text(encoding="utf-8"))
          table = "\n".join(
              f"| {row['name']} | `{row['run_id']}` | {row['event']} | {row['conclusion']} |"
              for row in rows
          )
          report = f'''# P2 Automated Product Evidence

          **Result:** `P2 AUTOMATED PRODUCT GATE READY`  
          **Tested product commit:** `{candidate}`  
          **Recorder run:** `{recorder}`  
          **Evidence scope:** automated Windows hosted-runner and deterministic native-neutral evidence only

          The exact candidate above passed every standard P1/P2 workflow definition present in the repository. The recorder refused to use results from an older or newer SHA.

          | Workflow | Run ID | Event | Result |
          |---|---:|---|---|
          {table}

          ## Implemented product surface

          - explicit keyboard, clipboard and auto modes with immutable per-session selection;
          - guarded current-clipboard normal paste without clipboard rewriting or restoration;
          - bounded clipboard revision, destination, integrity, modifier and cancellation checks;
          - native Win32 tray menu, content-free notifications and reviewed hotkey presets;
          - strict versioned per-user settings with backup recovery;
          - current-user startup-at-login integration;
          - release-subsystem tray executable plus controlled console-capable debug builds;
          - reproducible per-user package/install/uninstall workflow;
          - backend benchmark, race harness, controlled E2E and privacy checks.

          ## Security and privacy boundary

          Clipboard/injected plaintext is not written to configuration, normal logs, status, notifications, evidence reports, or package metadata. Clipboard mode does not clear, replace, own, or restore the user's clipboard. ClipType remains one unprivileged process and does not bypass UIPI or automatically elevate.

          ## Compatibility boundary

          This automated result is not `WINDOWS BETA READY`. Human physical hotkey/cancel behavior, Chromium, Electron/VS Code, terminal, same-render-host logical fields, elevated targets, Windows 10, and measured physical timing remain tracked by issue #33 before public beta or broad compatibility claims.

          ## Promotion boundary

          This report does not authorize merge, tag, signing, publication, release, or public beta promotion.
          '''
          report = "\n".join(line[10:] if line.startswith("          ") else line for line in report.splitlines()) + "\n"
          path = Path("docs/testing/P2_AUTOMATED_EVIDENCE.md")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(report, encoding="utf-8")

          consistency = '''name: P2 Evidence Consistency

          on:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            evidence-consistency:
              runs-on: ubuntu-24.04
              steps:
                - name: Check out repository
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                - name: Verify product evidence invariants
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -f docs/testing/P2_AUTOMATED_EVIDENCE.md
                    grep -q 'P2 AUTOMATED PRODUCT GATE READY' docs/testing/P2_AUTOMATED_EVIDENCE.md
                    grep -q 'windows_subsystem = "windows"' apps/cliptype/src/main.rs
                    if find .github/workflows -maxdepth 1 -name 'p2-one-time-*.yml' | grep -q .; then
                      echo 'transient one-time workflow remains'
                      exit 1
                    fi
          '''
          consistency = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in consistency.splitlines()
          ) + "\n"
          Path(".github/workflows/p2-gate-recorder.yml").write_text(
              consistency,
              encoding="utf-8",
          )
          for transient in Path(".github/workflows").glob("p2-one-time-*.yml"):
              transient.unlink()

      - name: Commit evidence-only finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/P2_AUTOMATED_EVIDENCE.md .github/workflows
          git commit -m "docs: record exact-head P2 automated product gate"
          git push origin HEAD:feat/p2-windows-productization
