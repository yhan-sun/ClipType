name: P3 Deterministic All-platform Gate

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths:
      - ".github/scripts/materialize_p3.py"
      - ".github/workflows/p3-pr-gate-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-cross-platform-finalize
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FEATURE_BRANCH: feat/p3-cross-platform-ui-macos
  SOURCE_ARTIFACT: p3-v3-reviewed-source

jobs:
  prepare:
    name: Materialize reviewed source and verify shared layer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize the SHA-pinned source tree
        run: python3 .github/scripts/materialize_p3.py --repository . --force
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Normalize formatting and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git diff --check
      - name: Check shared crates
        run: cargo check --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app -p cliptype-ui
      - name: Test shared crates
        run: cargo test -p cliptype-core -p cliptype-platform -p cliptype-app -p cliptype-ui
      - name: Lint shared crates
        run: cargo clippy --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app -p cliptype-ui -- -D warnings
      - name: Create deterministic source bundle and manifest
        shell: bash
        run: |
          set -euo pipefail
          find Cargo.toml Cargo.lock apps crates assets packaging .github/workflows/p3-cross-platform.yml .github/workflows/macos-release.yml \
            -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > /tmp/p3-source-manifest.sha256
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude=.github/p3-stage2 \
            --exclude=.github/p3-ci-diagnostics \
            -czf /tmp/p3-reviewed-source.tar.gz \
            Cargo.toml Cargo.lock apps crates assets packaging \
            .github/workflows/p3-cross-platform.yml \
            .github/workflows/macos-release.yml
          shasum -a 256 /tmp/p3-reviewed-source.tar.gz | tee /tmp/p3-source-bundle.sha256
      - name: Upload reviewed source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-v3-reviewed-source
          path: |
            /tmp/p3-reviewed-source.tar.gz
            /tmp/p3-source-manifest.sha256
            /tmp/p3-source-bundle.sha256
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Complete Windows workspace
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download reviewed source bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p3-v3-reviewed-source
          path: source-artifact
      - name: Install the exact reviewed source tree
        shell: pwsh
        run: |
          tar -xzf source-artifact/p3-reviewed-source.tar.gz
          if (-not (Test-Path crates/cliptype-macos/Cargo.toml)) { throw "macOS source missing from reviewed bundle" }
      - name: Install pinned Rust
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  macos:
    name: Native macOS ${{ matrix.arch }} workspace
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15-arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download reviewed source bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p3-v3-reviewed-source
          path: source-artifact
      - name: Install the exact reviewed source tree
        run: |
          tar -xzf source-artifact/p3-reviewed-source.tar.gz
          chmod +x packaging/macos/package.sh
          test -f crates/cliptype-macos/Cargo.toml
          test -f apps/cliptype-macos/Cargo.toml
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component clippy \
            --target ${{ matrix.target }}
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}
      - name: Test workspace
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Build release app
        run: cargo build --release --locked -p cliptype-macos-app --target ${{ matrix.target }}
      - name: Stage executable
        run: |
          mkdir -p executable
          cp target/${{ matrix.target }}/release/cliptype-macos executable/cliptype-macos-${{ matrix.arch }}
      - name: Upload architecture executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-v3-macos-${{ matrix.arch }}
          path: executable/cliptype-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  universal:
    name: Universal 2 binary verification
    needs: macos
    runs-on: macos-15-arm64
    timeout-minutes: 15
    steps:
      - name: Download arm64 executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p3-v3-macos-arm64
          path: input/arm64
      - name: Download Intel executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p3-v3-macos-x86_64
          path: input/x86_64
      - name: Build and verify Universal 2 executable
        run: |
          mkdir -p output
          lipo -create \
            input/arm64/cliptype-macos-arm64 \
            input/x86_64/cliptype-macos-x86_64 \
            -output output/cliptype-macos
          lipo -verify_arch arm64 x86_64 output/cliptype-macos
          lipo -info output/cliptype-macos | tee output/lipo-info.txt
      - name: Upload Universal 2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-v3-universal2
          path: output
          if-no-files-found: error
          retention-days: 3

  finalize:
    name: Commit verified tree and promote P3 PR
    needs: [prepare, windows, macos, universal]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Ensure candidate is still the feature head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH"
          current="$(git rev-parse "origin/${FEATURE_BRANCH}")"
          test "$current" = "$GITHUB_SHA"
      - name: Download reviewed source bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p3-v3-reviewed-source
          path: source-artifact
      - name: Install the exact all-platform-tested tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf source-artifact/p3-reviewed-source.tar.gz
          chmod +x packaging/macos/package.sh
          find Cargo.toml Cargo.lock apps crates assets packaging .github/workflows/p3-cross-platform.yml .github/workflows/macos-release.yml \
            -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > /tmp/p3-final-manifest.sha256
          diff -u source-artifact/p3-source-manifest.sha256 /tmp/p3-final-manifest.sha256
      - name: Remove all one-time transport and repair machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/p3-stage2 .github/p3-ci-diagnostics
          for path in \
            .github/scripts/materialize_p3.py \
            .github/workflows/p3-stage2-apply.yml \
            .github/workflows/p3-finalize.yml \
            .github/workflows/p3-finalize-v2.yml \
            .github/workflows/p3-unpack-source.yml \
            .github/workflows/p3-machine-fix.yml \
            .github/workflows/p3-macos-repair.yml \
            .github/workflows/p3-pr-gate.yml \
            .github/workflows/p3-pr-gate-v2.yml \
            .github/workflows/p3-pr-gate-v3.yml \
            .github/workflows/p3-promote-pr.yml; do
            rm -f "$path"
          done
      - name: Record immutable green proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/p3-green
          bundle_sha="$(cut -d' ' -f1 source-artifact/p3-source-bundle.sha256)"
          cat > .github/p3-green/platform-gate.txt <<EOF
          verified_candidate_sha=${GITHUB_SHA}
          source_payload_sha256=a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9
          source_bundle_sha256=${bundle_sha}
          workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          shared=success
          windows=success
          macos_arm64=success
          macos_x86_64=success
          universal2=success
          EOF
          git diff --check
      - name: Commit verified P3 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "P3: add cross-platform settings UI and macOS app"
          git push origin HEAD:${FEATURE_BRANCH}
      - name: Create or promote implementation PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$FEATURE_BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          cat >"$body_file" <<'EOF'
          ## Summary

          Implements the complete P3 cross-platform product slice:

          - shared native Slint settings UI;
          - versioned settings and transactional custom trigger/cancel shortcuts;
          - Windows live shortcut replacement with native registration probing;
          - macOS clipboard, target, Unicode keyboard, paste, permission, login-item, shortcut, and AppKit menu-bar adapters;
          - macOS menu-bar composition root;
          - Universal 2 build and packaging automation;
          - protected signed/notarized macOS release workflow.

          ## Safety and privacy invariants

          - clipboard plaintext is never persisted or logged;
          - no global key logger or low-level keyboard hook is introduced;
          - target identity remains content-blind;
          - shortcut replacement is all-or-nothing and preserves the previous live pair on failure;
          - Accessibility prompting requires explicit user action;
          - public signed/notarized release remains blocked without protected maintainer credentials.

          ## Automated evidence

          The exact SHA-pinned source bundle committed by this PR passed:

          - shared core/UI formatting, checks, tests, and Clippy with warnings denied;
          - complete Windows workspace checks, tests, and Clippy;
          - native Apple Silicon macOS checks, tests, Clippy, and release build;
          - native Intel macOS checks, tests, Clippy, and release build;
          - Universal 2 `lipo` architecture verification.

          The immutable evidence is recorded in `.github/p3-green/platform-gate.txt`.

          ## Manual release validation still required

          - controlled Accessibility authorization and revocation on a maintainer Mac;
          - focus-change and Secure Event Input behavior in representative applications;
          - Developer ID signing, notarization, stapling, and Gatekeeper assessment with protected credentials.
          EOF
          if [[ -z "$number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$FEATURE_BRANCH" \
              --title "P3: cross-platform settings UI and macOS menu-bar app" \
              --body-file "$body_file"
          else
            gh pr edit "$number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "P3: cross-platform settings UI and macOS menu-bar app" \
              --body-file "$body_file"
            if [[ "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "true" ]]; then
              gh pr ready "$number" --repo "$GITHUB_REPOSITORY"
            fi
          fi
