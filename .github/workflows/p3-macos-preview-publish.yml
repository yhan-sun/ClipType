name: P3 macOS Testing Preview Publisher

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
    paths:
      - ".github/workflows/p3-macos-preview-publish.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  VERSION: v0.2.0-beta.1
  FEATURE_BRANCH: feat/p3-cross-platform-ui-macos

jobs:
  publish:
    name: Fix, validate, merge, publish, and verify
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out current P3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0

      - name: Freeze branch on latest main and repair known failures
        id: freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python3 - <<'PY'
          from pathlib import Path

          main = Path("apps/cliptype-macos/src/main.rs")
          text = main.read_text(encoding="utf-8")
          private = "        const fn label(self) -> &'static str {"
          visible = "        pub(super) const fn label(self) -> &'static str {"
          if private in text:
              text = text.replace(private, visible, 1)
          if visible not in text:
              raise SystemExit("HostError::label visibility repair did not apply")
          main.write_text(text, encoding="utf-8")

          native = Path("crates/cliptype-macos/src/native.rs")
          lines = native.read_text(encoding="utf-8").splitlines()
          output = []
          removed = False
          for line in lines:
              if not removed and line.strip() == "Arc,":
                  removed = True
                  continue
              output.append(line)
          native.write_text("\n".join(output) + "\n", encoding="utf-8")

          gate = Path(".github/workflows/p3-real-host-evidence.yml")
          if gate.exists():
              gate_text = gate.read_text(encoding="utf-8")
              marker = "  PYTHONDONTWRITEBYTECODE: 1\n"
              cache = "  PYTHONPYCACHEPREFIX: /tmp/cliptype-p3-pycache\n"
              if cache not in gate_text and marker in gate_text:
                  gate_text = gate_text.replace(marker, marker + cache, 1)
              gate.write_text(gate_text, encoding="utf-8")

          version = Path("release/VERSION")
          if version.exists():
              version.write_text("v0.2.0-beta.1\n", encoding="utf-8")
          PY

          rm -f .github/workflows/p3-fix-macos-release-candidate.yml
          rm -f .github/workflows/p3-publish-macos-testing-preview.yml
          rm -f .github/workflows/p3-macos-preview-publish.yml

          cargo fmt --all -- --check
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "fix(p3): finalize macOS testing-preview candidate"
          fi
          git push origin "HEAD:${FEATURE_BRANCH}"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'candidate_tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust and both macOS targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Validate native Apple Silicon source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked --target aarch64-apple-darwin
          cargo test --workspace --locked --target aarch64-apple-darwin
          cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings

      - name: Validate Intel source and compile slice
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --locked --target x86_64-apple-darwin
          cargo clippy --workspace --all-targets --locked --target x86_64-apple-darwin -- -D warnings
          cargo build --release --locked -p cliptype-macos-app --target x86_64-apple-darwin

      - name: Build Apple Silicon slice
        shell: bash
        run: cargo build --release --locked -p cliptype-macos-app --target aarch64-apple-darwin

      - name: Assemble and validate Universal 2 app
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.freeze.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          APP="dist/ClipType.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"
          mkdir -p "$MACOS" "$RESOURCES" release-assets
          lipo -create \
            target/x86_64-apple-darwin/release/cliptype-macos \
            target/aarch64-apple-darwin/release/cliptype-macos \
            -output "$MACOS/cliptype-macos"
          chmod +x "$MACOS/cliptype-macos"
          lipo -verify_arch x86_64 arm64 "$MACOS/cliptype-macos"

          if [[ -f packaging/macos/Info.plist.template ]]; then
            cp packaging/macos/Info.plist.template "$CONTENTS/Info.plist"
            python3 - <<'PY'
          from pathlib import Path
          path = Path("dist/ClipType.app/Contents/Info.plist")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "@VERSION@": "0.2.0-beta.1",
              "@EXECUTABLE@": "cliptype-macos",
              "@BUNDLE_IDENTIFIER@": "dev.cliptype.ClipType",
              "${VERSION}": "0.2.0-beta.1",
              "${EXECUTABLE}": "cliptype-macos",
              "${BUNDLE_IDENTIFIER}": "dev.cliptype.ClipType",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          else
            cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>ClipType</string>
          <key>CFBundleExecutable</key><string>cliptype-macos</string>
          <key>CFBundleIdentifier</key><string>dev.cliptype.ClipType</string>
          <key>CFBundleName</key><string>ClipType</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.2.0-beta.1</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSUIElement</key><true/>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          fi
          plutil -lint "$CONTENTS/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$CONTENTS/Info.plist" 2>/dev/null || true)"
          if [[ -z "$executable" || ! -x "$MACOS/$executable" ]]; then
            /usr/libexec/PlistBuddy -c 'Delete :CFBundleExecutable' "$CONTENTS/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string cliptype-macos' "$CONTENTS/Info.plist"
          fi

          icon="$(find packaging/macos assets -type f -name '*.icns' 2>/dev/null | head -1 || true)"
          if [[ -n "$icon" ]]; then
            cp "$icon" "$RESOURCES/ClipType.icns"
            /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconFile' "$CONTENTS/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFile string ClipType.icns' "$CONTENTS/Info.plist"
          fi
          cp LICENSE-MIT LICENSE-APACHE "$RESOURCES/"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "release-assets/ClipType-${VERSION}-macos-universal2-UNSIGNED.zip"
          hdiutil create -volname "ClipType ${VERSION} Testing Preview" -srcfolder "$APP" \
            -ov -format UDZO "release-assets/ClipType-${VERSION}-macos-universal2-UNSIGNED.dmg"
          cat > release-assets/BUILD-INFO-macos.txt <<EOF
          version=${VERSION}
          source_commit=${CANDIDATE_SHA}
          architecture=Universal 2 (x86_64, arm64)
          signing=ad-hoc only
          developer_id=false
          notarized=false
          stapled=false
          release_class=post-release-testing-preview
          EOF
          cat > release-assets/README-macOS-TESTING-PREVIEW.txt <<'EOF'
          This Universal 2 prerelease is intentionally published before physical-Mac validation.
          It is ad-hoc signed only, not Developer ID signed, not notarized, and not stapled.
          Gatekeeper may block it. It is for post-release compatibility testing, not a broad
          macOS support or trusted-publisher claim.
          EOF
          (cd release-assets && shasum -a 256 BUILD-INFO-macos.txt README-macOS-TESTING-PREVIEW.txt ClipType-* > SHA256SUMS-macos.txt)

      - name: Merge the exact validated PR tree
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.freeze.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.freeze.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/55" --jq .head.sha)"
          test "$actual" = "$CANDIDATE_SHA"
          gh pr ready 55 --repo "$GITHUB_REPOSITORY" || true
          response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/55/merge" \
            -f merge_method=merge -f sha="$CANDIDATE_SHA" \
            -f commit_title='P3: cross-platform settings UI and macOS testing preview (#55)')"
          test "$(jq -r .merged <<<"$response")" = true
          merge_sha="$(jq -r .sha <<<"$response")"
          git fetch origin "$merge_sha"
          merge_tree="$(git rev-parse FETCH_HEAD^{tree})"
          test "$merge_tree" = "$CANDIDATE_TREE"
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Publish immutable macOS testing prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          cat > /tmp/release-notes.md <<EOF
          ## ClipType ${VERSION} — macOS post-release testing preview

          Adds the cross-platform Settings UI, custom Trigger/Cancel shortcuts, and a Universal 2 macOS candidate.

          **Distribution boundary:** ad-hoc signed only; no Developer ID signature, notarization, or stapled ticket. Gatekeeper may block this build. This publication intentionally precedes physical-Mac validation and is not a broad compatibility claim.

          Exact source: `${MERGE_SHA}`
          EOF
          gh release create "$VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" --title "ClipType ${VERSION} — macOS Testing Preview" \
            --notes-file /tmp/release-notes.md --prerelease

      - name: Download and verify public release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir downloaded extracted
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded
          (cd downloaded && shasum -a 256 -c SHA256SUMS-macos.txt)
          ditto -x -k downloaded/ClipType-${VERSION}-macos-universal2-UNSIGNED.zip extracted
          lipo -verify_arch x86_64 arm64 extracted/ClipType.app/Contents/MacOS/cliptype-macos
          codesign --verify --deep --strict extracted/ClipType.app
          plutil -lint extracted/ClipType.app/Contents/Info.plist

      - name: Close #48 as explicitly deferred and create post-release tracker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          tracker="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'P3-R01 in:title' --json number --jq '.[0].number // empty')"
          if [[ -z "$tracker" ]]; then
            cat > /tmp/tracker.md <<EOF
          The maintainer explicitly changed the sequence to publish first and test the immutable macOS asset afterward.

          Release: `${VERSION}`
          Source: `${MERGE_SHA}`

          Required physical-Mac checks: Apple Silicon and Intel/Rosetta launch; Accessibility grant/revoke; representative Unicode/CJK input; clipboard paste and revision guard; custom hotkey conflict/replacement/rollback; focus change and cancellation; menu-bar/Settings lifecycle; Start at Login; privacy sentinel; and observed Gatekeeper behavior for this deliberately unnotarized preview.

          Hosted CI cannot close this issue.
          EOF
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "P3-R01: Post-release physical Mac validation for ${VERSION}" \
              --body-file /tmp/tracker.md
          fi
          gh issue comment 48 --repo "$GITHUB_REPOSITORY" --body "Maintainer decision: publish first, then test the immutable macOS artifact. ${VERSION} is published from ${MERGE_SHA} as an explicitly ad-hoc-signed, unnotarized testing preview. Closing this issue records the changed gate order; it does **not** claim the original interactive acceptance criteria passed. Physical-Mac validation remains tracked by P3-R01."
          gh issue close 48 --repo "$GITHUB_REPOSITORY" --reason completed
