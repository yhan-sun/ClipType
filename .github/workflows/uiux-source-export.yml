name: UIUX Source Export

on:
  push:
    branches:
      - feat/macos-uiux-beta7
    paths:
      - ".github/workflows/uiux-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export exact branch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git archive --format=zip --output=export/cliptype-uiux-source.zip HEAD
          git rev-parse HEAD > export/SOURCE_SHA.txt
      - name: Upload source export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cliptype-uiux-source
          path: export/
          if-no-files-found: error
          retention-days: 1
