name: P4 macOS Apple Silicon

on:
  pull_request:
    paths:
      - "apps/cliptype-flutter/**"
      - "crates/cliptype-*/**"
      - "scripts/**"
      - "docs/**"
      - "release/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/p4-macos-arm64.yml"
  push:
    branches:
      - main
    paths:
      - "release/VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-macos-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-install-package:
    name: Flutter macOS arm64 build, install, and preview checks
    runs-on: macos-14
    timeout-minutes: 55
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify and record tested source identity
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\nsource_tree=%s\nworkflow_commit=%s\n' \
            "$actual" "$tree" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(arch)" = "arm64"
          sw_vers

      - name: Validate immutable candidate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < release/VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test -f "docs/releases/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run native Code and Swift bridge contract gates
        shell: bash
        env:
          CC: clang
          SWIFTC: swiftc
        run: |
          set -euo pipefail
          python3 scripts/verify_code_navigation.py
          python3 -m unittest discover -s scripts/tests -p 'test_code_navigation_gate.py' -v
          python3 scripts/verify_bridge_completion.py

      - name: Install pinned Flutter toolchain
        shell: bash
        env:
          FLUTTER_VERSION: 3.47.2
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --enable-macos-desktop
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal \
            --component rustfmt --component clippy \
            --target aarch64-apple-darwin

      - name: Run requested Rust quality gate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 check --workspace --all-targets --locked
          cargo +1.98.0 test --workspace --locked
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run requested Flutter quality gate and release build
        shell: bash
        working-directory: apps/cliptype-flutter
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get
          flutter analyze
          flutter test
          flutter build macos --release

      - name: Ad-hoc sign and verify arm64 application bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/apps/cliptype-flutter/build/macos/Build/Products/Release/ClipType.app"
          test -d "$app"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Signature=adhoc" "$RUNNER_TEMP/codesign.txt"

          test "$(lipo -archs "$executable")" = "arm64"
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              test "$(lipo -archs "$candidate")" = "arm64"
            fi
          done < <(find "$app" -type f -print0)

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "executable_name=$executable_name" >> "$GITHUB_OUTPUT"

      - name: Install exact bundle at /Applications and launch-smoke it
        shell: bash
        env:
          BUILT_APP: ${{ steps.bundle.outputs.app }}
          EXECUTABLE_NAME: ${{ steps.bundle.outputs.executable_name }}
        run: |
          set -euo pipefail
          installed="/Applications/ClipType.app"
          sudo rm -rf "$installed"
          sudo ditto "$BUILT_APP" "$installed"
          test -d "$installed"
          codesign --verify --deep --strict --verbose=2 "$installed"
          cmp \
            "$BUILT_APP/Contents/MacOS/$EXECUTABLE_NAME" \
            "$installed/Contents/MacOS/$EXECUTABLE_NAME"

          log="$RUNNER_TEMP/cliptype-launch.log"
          "$installed/Contents/MacOS/$EXECUTABLE_NAME" >"$log" 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true

      - name: Package and independently verify preview assets
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILT_APP: ${{ steps.bundle.outputs.app }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist/macos-arm64"
          mkdir -p "$dist"
          zip_name="ClipType-${VERSION}-macos-arm64-UNSIGNED.zip"
          dmg_name="ClipType-${VERSION}-macos-arm64-UNSIGNED.dmg"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$BUILT_APP" "$dist/$zip_name"

          dmg_stage="$RUNNER_TEMP/cliptype-dmg-stage"
          rm -rf "$dmg_stage"
          mkdir -p "$dmg_stage"
          /usr/bin/ditto "$BUILT_APP" "$dmg_stage/ClipType.app"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create \
            -volname "ClipType ${VERSION} arm64 preview" \
            -srcfolder "$dmg_stage" \
            -ov -format UDZO "$dist/$dmg_name"

          cat > "$dist/BUILD-INFO-macos.txt" <<INFO
          release_candidate=$VERSION
          source_commit=$SOURCE_SHA
          source_tree=$SOURCE_TREE
          workflow_commit=$GITHUB_SHA
          target=aarch64-apple-darwin
          frontend=Flutter
          installed_path=/Applications/ClipType.app
          signing=ad-hoc
          developer_id=NOT_CONFIGURED
          notarization=NOT_RUN
          stapling=NOT_RUN
          gatekeeper=NOT_CLAIMED
          universal_2=NO
          accessibility_interactive=NOT_RUN
          vscode_real_input=NOT_RUN
          compatibility_claim=macOS_arm64_testing_preview_only
          INFO

          cat > "$dist/README-macOS-TESTING-PREVIEW.txt" <<'README'
          ClipType macOS arm64 testing preview

          This artifact is Apple-Silicon-only and ad-hoc signed. It is not
          Developer ID signed, notarized, stapled, Universal 2, Intel/Rosetta,
          or a general macOS release. Hosted CI builds, installs, verifies, and
          launch-smokes the bundle. It cannot grant persistent Accessibility
          permission or perform a human VS Code/Monaco input session; those
          checks remain NOT RUN until an exact-release physical report exists.
          README

          (
            cd "$dist"
            shasum -a 256 "$zip_name" "$dmg_name" \
              BUILD-INFO-macos.txt README-macOS-TESTING-PREVIEW.txt \
              > SHA256SUMS-macos.txt
            shasum -a 256 -c SHA256SUMS-macos.txt
          )

          extract="$RUNNER_TEMP/cliptype-zip-extract"
          rm -rf "$extract"
          mkdir -p "$extract"
          /usr/bin/ditto -x -k "$dist/$zip_name" "$extract"
          test -d "$extract/ClipType.app"
          codesign --verify --deep --strict --verbose=2 "$extract/ClipType.app"
          test "$(lipo -archs "$extract/ClipType.app/Contents/MacOS/ClipType")" = "arm64"

          mount="$RUNNER_TEMP/cliptype-dmg-mount"
          rm -rf "$mount"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dist/$dmg_name"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          test -d "$mount/ClipType.app"
          test -L "$mount/Applications"
          codesign --verify --deep --strict --verbose=2 "$mount/ClipType.app"
          test "$(lipo -archs "$mount/ClipType.app/Contents/MacOS/ClipType")" = "arm64"
          hdiutil detach "$mount"
          trap - EXIT

          echo "artifact_name=macos-arm64-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.dist }}
          if-no-files-found: error
          retention-days: 14

  publish-testing-preview:
    name: Attach exact macOS arm64 preview to prerelease
    needs: build-install-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build-install-package.outputs.version }}
      ARTIFACT_NAME: ${{ needs.build-install-package.outputs.artifact_name }}
    steps:
      - name: Download exact validated macOS assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-assets

      - name: Wait boundedly for the Windows release workflow
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for _ in $(seq 1 120); do
            if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 10
          done
          test "$found" = true

      - name: Verify exact tag, prerelease, and additive asset names
        shell: bash
        run: |
          set -euo pipefail
          target="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          prerelease="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)"
          test "$target" = "$GITHUB_SHA"
          test "$tag_sha" = "$GITHUB_SHA"
          test "$prerelease" = true

          existing="$RUNNER_TEMP/existing-assets.txt"
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "$existing"
          while IFS= read -r asset; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" "$existing"; then
              echo "refusing to overwrite existing release asset: $name" >&2
              exit 1
            fi
          done < <(find release-assets -maxdepth 1 -type f -print)

          (
            cd release-assets
            shasum -a 256 -c SHA256SUMS-macos.txt
          )

      - name: Upload supplemental preview assets without clobbering
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY"

      - name: Re-download and verify published macOS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir published-assets
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --dir published-assets
          while IFS= read -r local_asset; do
            name="$(basename "$local_asset")"
            cmp "$local_asset" "published-assets/$name"
          done < <(find release-assets -maxdepth 1 -type f -print)
          (
            cd published-assets
            shasum -a 256 -c SHA256SUMS-macos.txt
          )
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isPrerelease,url,assets
