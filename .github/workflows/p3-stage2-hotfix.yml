name: P3 Stage 2 Workflow Hotfix

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-stage2-hotfix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Expose the staged host error to its parent module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/p3-stage2-apply.yml')
          text = workflow.read_text(encoding='utf-8')
          needle = "          host.write_text(text, encoding='utf-8')"
          patch = "\n".join([
              "          text = text.replace(",
              "              '    enum HostError {',",
              "              '    pub(super) enum HostError {',",
              "              1,",
              "          )",
              needle,
          ])
          if needle not in text:
              raise SystemExit('HostError workflow patch marker not found')
          workflow.write_text(text.replace(needle, patch, 1), encoding='utf-8')
          PY
          git rm .github/workflows/p3-stage2-hotfix.yml
      - name: Commit workflow hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/p3-stage2-apply.yml
          git commit -m "ci(p3): expose staged macOS host error type"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
