name: P3 Candidate Gate And PR

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-candidate-gate.yml"]
  workflow_dispatch:

concurrency:
  group: p3-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  candidate:
    name: Gate macOS Universal 2 candidate and open PR
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Require production source
        run: |
          test -f crates/cliptype-macos/Cargo.toml
          test -f apps/cliptype-macos/Cargo.toml
          test -f crates/cliptype-ui/ui/settings.slint
          test -f .github/workflows/p3-cross-platform.yml
          test -f .github/workflows/macos-release.yml
      - name: Install pinned Rust targets
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin --toolchain 1.98.0
      - name: Formatting and lockfile gate
        run: |
          cargo fmt --all -- --check
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock
      - name: Native arm64 quality gate
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets 2>&1 | tee /tmp/candidate-native-check.log
          cargo test --workspace 2>&1 | tee /tmp/candidate-native-test.log
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/candidate-native-clippy.log
      - name: Intel and Universal 2 gate
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/candidate-intel-check.log
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin 2>&1 | tee /tmp/candidate-arm64-build.log
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin 2>&1 | tee /tmp/candidate-intel-build.log
          lipo -create target/aarch64-apple-darwin/release/cliptype-macos target/x86_64-apple-darwin/release/cliptype-macos -output /tmp/cliptype-macos-universal
          archs="$(lipo -archs /tmp/cliptype-macos-universal)"
          [[ "$archs" == "arm64 x86_64" || "$archs" == "x86_64 arm64" ]]
      - name: Build unsigned candidate package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=v0.2.0-beta.1 \
          ARM64_BINARY=target/aarch64-apple-darwin/release/cliptype-macos \
          X86_64_BINARY=target/x86_64-apple-darwin/release/cliptype-macos \
          OUTPUT_DIR="$RUNNER_TEMP/p3-package" \
          packaging/macos/package.sh
          find "$RUNNER_TEMP/p3-package" -maxdepth 3 -type f -print
      - name: Upload focused diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-candidate-gate-diagnostics
          path: /tmp/candidate-*.log
          if-no-files-found: warn
          retention-days: 1
      - name: Record candidate evidence
        shell: bash
        run: |
          mkdir -p docs/testing
          cat > docs/testing/P3_AUTOMATED_CANDIDATE.md <<EOF
          # P3 automated candidate evidence

          - Commit: $GITHUB_SHA
          - Native runner: macOS 15 arm64
          - Rust: 1.98.0
          - Native workspace check/test/Clippy: PASS
          - Intel workspace cross-check: PASS
          - Apple Silicon release build: PASS
          - Intel release build: PASS
          - Universal 2 lipo validation: PASS
          - Unsigned candidate package assembly: PASS

          This evidence does not claim interactive Accessibility authorization, real global-hotkey conflict behavior in a logged-in user session, Developer ID signing, notarization, or Gatekeeper approval.
          EOF
      - name: Commit evidence and retire one-time gate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p3-candidate-gate.yml
          git rm -f --ignore-unmatch .github/workflows/p3-macos-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P3: record automated Universal 2 candidate evidence"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
      - name: Create or update draft P3 PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$REPO" --head feat/p3-cross-platform-ui-macos --base main --state open --json number --jq '.[0].number // empty')"
          title="P3: cross-platform Settings UI, custom hotkeys, and macOS Universal 2"
          body="$(mktemp)"
          cat > "$body" <<'EOF'
          ## Delivered

          - shared Slint Settings UI for Windows and macOS;
          - recorded Trigger and Cancel shortcuts;
          - static validation, OS registration probing, atomic replacement, and rollback;
          - live Windows hotkey updates without a keyboard hook;
          - macOS NSPasteboard, Core Graphics input, focus/Accessibility evidence, permissions, login item, Carbon hotkeys, and AppKit menu bar;
          - Apple Silicon + Intel builds, Universal 2 validation, app/ZIP/DMG packaging;
          - signing, notarization, stapling, and GitHub release hooks that require protected Apple credentials.

          ## Automated evidence

          See `docs/testing/P3_AUTOMATED_CANDIDATE.md`.

          ## Remaining promotion gates

          - unlocked-client Windows and macOS interactive testing;
          - real Accessibility grant/revoke flow;
          - real shortcut conflict and rollback testing;
          - Developer ID signing and notarization with protected credentials;
          - final privacy/security/release review.

          Tracks #43, #44, #45, #46, #47, #48, #49, #50, and #51.
          EOF
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file "$body"
          else
            gh pr create --repo "$REPO" --base main --head feat/p3-cross-platform-ui-macos --draft --title "$title" --body-file "$body"
          fi
