name: P3 Payload Recovery

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-payload-recover.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Find the CRC-complete reviewed macOS archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Exhaust redundant chunk combinations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import itertools
          import json
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path('.github/p3-stage2')
          tail = (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )
          def read(name):
              return ''.join((root / name).read_text(encoding='ascii').split())
          fixed = {i: read(f'chunk-{i:02d}.b64') for i in (0, 1, 3, 6, 7)}
          variants = {
              2: {
                  'large': read('chunk-02.b64'),
                  'split': ''.join(read(f'chunk-02{s}.b64') for s in 'abcd'),
              },
              4: {
                  'large': read('chunk-04.b64'),
                  'split': ''.join(read(f'chunk-04{s}.b64') for s in 'abcd'),
              },
              5: {
                  'large': read('chunk-05.b64'),
                  'split': ''.join(read(f'chunk-05{s}.b64') for s in 'abcd'),
              },
          }
          results = []
          winners = []
          for choices in itertools.product(('large', 'split'), repeat=3):
              chosen = dict(zip((2, 4, 5), choices))
              segments = []
              for index in range(8):
                  segments.append(fixed[index] if index in fixed else variants[index][chosen[index]])
              encoded = ''.join(segments) + tail
              label = '-'.join(f'{index}:{chosen[index]}' for index in (2,4,5))
              row = {
                  'label': label,
                  'encoded_length': len(encoded),
                  'encoded_sha256': hashlib.sha256(encoded.encode('ascii')).hexdigest(),
                  'valid_base64': False,
                  'valid_gzip': False,
                  'valid_tar': False,
              }
              try:
                  raw = base64.b64decode(encoded, validate=True)
                  row['valid_base64'] = True
                  row['payload_bytes'] = len(raw)
                  row['payload_sha256'] = hashlib.sha256(raw).hexdigest()
                  uncompressed = gzip.decompress(raw)
                  row['valid_gzip'] = True
                  row['uncompressed_bytes'] = len(uncompressed)
                  row['uncompressed_sha256'] = hashlib.sha256(uncompressed).hexdigest()
                  with tarfile.open(fileobj=io.BytesIO(uncompressed), mode='r:') as archive:
                      members = archive.getmembers()
                      for member in members:
                          path = PurePosixPath(member.name)
                          if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk() or member.isdev():
                              raise RuntimeError(f'unsafe member {member.name}')
                          if member.isfile():
                              stream = archive.extractfile(member)
                              if stream is None or len(stream.read()) != member.size:
                                  raise RuntimeError(f'incomplete member {member.name}')
                      row['valid_tar'] = True
                      row['members'] = [member.name for member in members]
                  winners.append((label, encoded, raw, uncompressed, row))
              except Exception as error:
                  row['error'] = f'{type(error).__name__}: {error}'
              results.append(row)
              print(json.dumps(row, sort_keys=True))

          Path('/tmp/p3-recovery-report.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          if len(winners) != 1:
              raise SystemExit(f'expected exactly one CRC-complete archive, found {len(winners)}')
          label, encoded, raw, uncompressed, row = winners[0]
          Path('/tmp/p3-recovered-source.tar.gz').write_bytes(raw)
          Path('/tmp/p3-recovered-source.tar').write_bytes(uncompressed)
          Path('/tmp/p3-recovered-encoded.b64').write_text(encoded, encoding='ascii')
          Path('/tmp/p3-recovery-winner.json').write_text(json.dumps(row, indent=2), encoding='utf-8')
          print(f'winner={label}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-recovered-source
          path: |
            /tmp/p3-recovery-report.json
            /tmp/p3-recovery-winner.json
            /tmp/p3-recovered-source.tar.gz
            /tmp/p3-recovered-source.tar
            /tmp/p3-recovered-encoded.b64
          if-no-files-found: error
          retention-days: 3
