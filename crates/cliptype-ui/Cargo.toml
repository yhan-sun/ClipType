[package]
name = "cliptype-ui"
description = "Shared native-compiled settings UI for ClipType."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
cliptype-core.workspace = true
cliptype-platform.workspace = true
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }

[build-dependencies]
slint-build = "=1.17.1"

[lints]
workspace = true
