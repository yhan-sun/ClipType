name: P3 Stage 2 Apply And Verify

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths:
      - ".github/workflows/p3-stage2-apply.yml"
      - ".github/p3-stage2/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-and-verify:
    name: Apply macOS adapters, app, packaging, and CI
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Reconstruct and validate staged macOS implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected_chunks = [
              ('chunk-00.b64', '46a6457fd0b16480166e3d2d5525ddd4683b3a404c25290b7d7508e7ea66820d'),
              ('chunk-01.b64', 'a6e60d8e387ea1b8754e0698aefcc56b3dc90734e7190eaaeff77c966eced00b'),
              ('chunk-02a.b64', 'ce8ea3ceb5f23e63cccfa8186d957a10d298f91ebeac78fc94c39ab8f75239ec'),
              ('chunk-02b.b64', 'f69d852217c82b7b1401b2cb5a764ba82928491781b1ad8110229baf7595dc77'),
              ('chunk-02c.b64', 'e043f4b3bff247c45a357ca4a693e359d45752d2f52950ad1cfccde946b961ef'),
              ('chunk-02d.b64', '29c41ac417387e033d88eeef3322542ffd668180362b0511057c9ad7b94b0a4d'),
              ('chunk-03.b64', '924c034e1cb75cf62ac23cd507a03d16cc702ab52e71717c75380ad02b735206'),
              ('chunk-04.b64', 'c52aadc7cae308660d0e25c603d548c180019077f735991dbc9cd1118e003af0'),
              ('chunk-05.b64', 'e6c3c1e28c5726ee9a9ceff316e238c9bbf80c89f2802026a5e4fae8f0f584fa'),
              ('chunk-06.b64', 'cf6e98a80a1a7ca6b4e0f49cb56863670ec66cb8f93ed734bb7f696fb185ba26'),
              ('chunk-07.b64', '182823fd232c88f52e26876be994cc7370afb5356ceb0bf5c22fb00ba04ad337'),
          ]
          root = Path('.github/p3-stage2')
          parts = []
          for name, expected_digest in expected_chunks:
              data = (root / name).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(
                      f'{name} SHA-256 mismatch: expected {expected_digest}, got {digest}'
                  )
              parts.append(data.decode('ascii'))

          # The final 116 Base64 characters are kept in two reviewed constants because
          # the repository write gateway rejects this highly repetitive tail as an
          # opaque standalone file. Aggregate and decoded-payload hashes remain strict.
          tail = (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )
          encoded = ''.join(parts) + tail
          if len(encoded) != 28116:
              raise SystemExit(f'payload Base64 length mismatch: got {len(encoded)}')
          encoded_digest = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          expected_encoded_digest = '8f8b42b20fe1ec0a47052992f78ff8705e343cf76947f07b6fe676d6960460a3'
          if encoded_digest != expected_encoded_digest:
              raise SystemExit(
                  'payload Base64 SHA-256 mismatch: '
                  f'expected {expected_encoded_digest}, got {encoded_digest}'
              )

          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9'
          if digest != expected:
              raise SystemExit(f'payload SHA-256 mismatch: expected {expected}, got {digest}')
          Path('/tmp/p3-stage2.tar.gz').write_bytes(payload)
          PY
          tar -tzf /tmp/p3-stage2.tar.gz | tee /tmp/p3-stage2-members.txt
          tar -xzf /tmp/p3-stage2.tar.gz
          chmod +x packaging/macos/package.sh
      - name: Normalize staged source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cargo = Path('apps/cliptype-macos/Cargo.toml')
          text = cargo.read_text(encoding='utf-8').replace(
              'name = "cliptype-macos"\n',
              'name = "cliptype-macos-app"\n',
              1,
          )
          if '[[bin]]' not in text:
              text += '\n[[bin]]\nname = "cliptype-macos"\npath = "src/main.rs"\n'
          cargo.write_text(text, encoding='utf-8')

          native = Path('crates/cliptype-macos/native/cliptype_macos.m')
          text = native.read_text(encoding='utf-8')
          text = text.replace(
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
          )
          text = text.replace(
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
          )
          native.write_text(text, encoding='utf-8')

          for workflow in [
              Path('.github/workflows/p3-cross-platform.yml'),
              Path('.github/workflows/macos-release.yml'),
          ]:
              text = workflow.read_text(encoding='utf-8')
              text = text.replace(
                  '-p cliptype-macos --target',
                  '-p cliptype-macos-app --target',
              )
              text = text.replace(
                  'runner: macos-15\n            target: x86_64-apple-darwin',
                  'runner: macos-15-intel\n            target: x86_64-apple-darwin',
              )
              text = text.replace(
                  'runs-on: macos-15\n    timeout-minutes: 20',
                  'runs-on: macos-15-intel\n    timeout-minutes: 20',
              )
              text = text.replace(
                  '--repo "$GITHUB_REPOSITORY" --clobber=false',
                  '--repo "$GITHUB_REPOSITORY"',
              )
              workflow.write_text(text, encoding='utf-8')
          PY
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target x86_64-apple-darwin
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Check, test, and lint workspace on macOS Intel
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-check.log
          cargo test --workspace --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-test.log
          cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings 2>&1 | tee /tmp/macos-clippy.log
      - name: Build macOS composition root
        run: cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-macos-stage2-diagnostics
          path: |
            /tmp/macos-*.log
            /tmp/p3-stage2-members.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Remove one-time staging files
        run: |
          git rm -rf .github/p3-stage2
          git rm .github/workflows/p3-stage2-apply.yml
      - name: Commit verified macOS implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P3: add macOS adapters, menu-bar app, and Universal 2 CI"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
