name: macOS Unsigned Testing Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-unsigned-preview-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: macos-v0.2.0-beta.1-testing-preview
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: v0.2.0-beta.1

jobs:
  build-slices:
    name: Build macOS ${{ matrix.arch }} release slice
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target "${{ matrix.target }}"

      - name: Validate and build architecture slice
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 check --workspace --all-targets --locked --target "${{ matrix.target }}"
          cargo +1.98.0 test --workspace --locked --target "${{ matrix.target }}"
          cargo +1.98.0 clippy --workspace --all-targets --locked --target "${{ matrix.target }}" -- -D warnings
          cargo +1.98.0 build --release --locked -p cliptype-macos-app --target "${{ matrix.target }}"
          file "target/${{ matrix.target }}/release/cliptype-macos"

      - name: Upload architecture slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-preview-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/cliptype-macos
          if-no-files-found: error
          retention-days: 7

  assemble-and-publish:
    name: Assemble Universal 2 and publish GitHub prerelease
    needs: build-slices
    runs-on: macos-15
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download architecture slices
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: macos-preview-*
          path: slices

      - name: Assemble and validate Universal 2 application
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat release/VERSION)" = "$VERSION"
          chmod +x \
            slices/macos-preview-x86_64/cliptype-macos \
            slices/macos-preview-arm64/cliptype-macos
          mkdir -p universal
          lipo -create \
            slices/macos-preview-x86_64/cliptype-macos \
            slices/macos-preview-arm64/cliptype-macos \
            -output universal/ClipType
          archs="$(lipo -archs universal/ClipType)"
          [[ "$archs" == *arm64* ]]
          [[ "$archs" == *x86_64* ]]

          packaging/macos/package.sh "$VERSION" universal/ClipType dist/macos

          original_zip="dist/macos/ClipType-$VERSION-macos-universal.zip"
          original_dmg="dist/macos/ClipType-$VERSION-macos-universal.dmg"
          preview_zip="dist/macos/ClipType-$VERSION-macos-universal2-UNSIGNED.zip"
          preview_dmg="dist/macos/ClipType-$VERSION-macos-universal2-UNSIGNED.dmg"
          mv "$original_zip" "$preview_zip"
          mv "$original_dmg" "$preview_dmg"

          plutil -lint dist/macos/ClipType.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/macos/ClipType.app
          app_archs="$(lipo -archs dist/macos/ClipType.app/Contents/MacOS/ClipType)"
          [[ "$app_archs" == *arm64* ]]
          [[ "$app_archs" == *x86_64* ]]

          cat > dist/macos/BUILD-INFO-macos.txt <<INFO
          version=$VERSION
          source_sha=$GITHUB_SHA
          source_ref=$GITHUB_REF
          architectures=arm64,x86_64
          signature=ad-hoc
          developer_id=false
          notarized=false
          stapled=false
          channel=public-testing-preview
          INFO

          cat > dist/macos/README-macOS-TESTING-PREVIEW.txt <<'README'
          ClipType macOS testing preview

          This Universal 2 package contains both Apple Silicon (arm64) and Intel
          (x86_64) code. It is ad-hoc signed, is NOT Developer ID signed, and is
          NOT Apple notarized. macOS Gatekeeper may warn or block first launch.

          This preview is published for post-release compatibility testing. It is
          not a broad macOS compatibility claim. Do not use it for sensitive input
          until Accessibility, focus, shortcut-conflict, and representative-app
          testing has been completed on your Mac.
          README

          rm -f dist/macos/SHA256SUMS.txt
          (
            cd dist/macos
            shasum -a 256 \
              "ClipType-$VERSION-macos-universal2-UNSIGNED.zip" \
              "ClipType-$VERSION-macos-universal2-UNSIGNED.dmg" \
              BUILD-INFO-macos.txt \
              README-macOS-TESTING-PREVIEW.txt \
              > SHA256SUMS-macos.txt
            shasum -a 256 -c SHA256SUMS-macos.txt
          )

      - name: Attest published preview assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/macos/ClipType-${{ env.VERSION }}-macos-universal2-UNSIGNED.zip
            dist/macos/ClipType-${{ env.VERSION }}-macos-universal2-UNSIGNED.dmg
            dist/macos/SHA256SUMS-macos.txt
            dist/macos/BUILD-INFO-macos.txt
            dist/macos/README-macOS-TESTING-PREVIEW.txt

      - name: Create or update public GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ClipType $VERSION" \
              --prerelease \
              --notes-file "release/RELEASE_NOTES-$VERSION.md"
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ClipType $VERSION" \
              --prerelease \
              --notes-file "release/RELEASE_NOTES-$VERSION.md"
          fi
          gh release upload "$VERSION" \
            "dist/macos/ClipType-$VERSION-macos-universal2-UNSIGNED.zip" \
            "dist/macos/ClipType-$VERSION-macos-universal2-UNSIGNED.dmg" \
            dist/macos/SHA256SUMS-macos.txt \
            dist/macos/BUILD-INFO-macos.txt \
            dist/macos/README-macOS-TESTING-PREVIEW.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify public release through GitHub API
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = true
          for asset in \
            "ClipType-$VERSION-macos-universal2-UNSIGNED.zip" \
            "ClipType-$VERSION-macos-universal2-UNSIGNED.dmg" \
            SHA256SUMS-macos.txt \
            BUILD-INFO-macos.txt \
            README-macOS-TESTING-PREVIEW.txt; do
            jq -e --arg asset "$asset" '.assets[] | select(.name == $asset and .state == "uploaded")' \
              <<<"$release_json" >/dev/null
          done

      - name: Upload assembled candidate for workflow retention
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ClipType-${{ env.VERSION }}-macos-universal2-UNSIGNED
          path: |
            dist/macos/ClipType-${{ env.VERSION }}-macos-universal2-UNSIGNED.zip
            dist/macos/ClipType-${{ env.VERSION }}-macos-universal2-UNSIGNED.dmg
            dist/macos/SHA256SUMS-macos.txt
            dist/macos/BUILD-INFO-macos.txt
            dist/macos/README-macOS-TESTING-PREVIEW.txt
          if-no-files-found: error
          retention-days: 7
