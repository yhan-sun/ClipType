name: P2 One-Time Repair Finalizer

on:
  push:
    branches:
      - feat/p2-windows-productization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest productization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p2-windows-productization
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/p2-windows-productization
          git reset --hard origin/feat/p2-windows-productization
          cargo fmt --all
          rm -f .github/workflows/p2-one-time-format.yml
          rm -f .github/workflows/p2-one-time-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: finalize formatted P2 Windows tray bindings"
          for attempt in 1 2 3; do
            if git push origin HEAD:feat/p2-windows-productization; then
              exit 0
            fi
            git pull --rebase origin feat/p2-windows-productization
          done
          exit 1
