name: P3-01 Apply And Verify

on:
  push:
    branches:
      - feat/p3-01-hotkey-contracts
    paths:
      - ".github/workflows/p3-01-apply.yml"
      - ".github/patches/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apply:
    name: Apply hotkey contracts and settings migration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-01-hotkey-contracts
          fetch-depth: 0
      - name: Decode and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/patches/p3-01.patch.gz.b64 | gzip --decompress > /tmp/p3-01.patch
          git apply --index /tmp/p3-01.patch
          base64 --decode .github/patches/hotkey.rs.gz.b64 | gzip --decompress > crates/cliptype-core/src/hotkey.rs
          sed -i 's/CMD_HOTKEY => None$/CMD_HOTKEY => None,/' crates/cliptype-windows/src/tray.rs
          python - <<'PY'
          from pathlib import Path

          core_settings = Path('crates/cliptype-core/src/settings.rs')
          text = core_settings.read_text()
          text = text.replace(
              '        HotkeyKey, HotkeyPlatform, MAX_CHARACTERS_PER_SECOND, MAX_JITTER_PERCENT,\n',
              '        MAX_CHARACTERS_PER_SECOND, MAX_JITTER_PERCENT,\n',
          )
          text = text.replace(
              '    use crate::InjectionMode;\n',
              '    use crate::{HotkeyKey, HotkeyPlatform, InjectionMode};\n',
          )
          core_settings.write_text(text)

          app_settings = Path('crates/cliptype-app/src/settings.rs')
          text = app_settings.read_text()
          text = text.replace('CtrlAltShiftFunction', 'AltShift')
          text = text.replace('CtrlAltFunction', 'Alt')
          text = text.replace('CtrlShiftFunction', 'Shift')
          app_settings.write_text(text)
          PY
          git add crates/cliptype-core/src/hotkey.rs crates/cliptype-core/src/settings.rs crates/cliptype-app/src/settings.rs crates/cliptype-windows/src/tray.rs
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Format source
        run: cargo fmt --all
      - name: Verify native-neutral crates
        run: |
          cargo check --locked --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app
          cargo test --locked -p cliptype-core -p cliptype-platform -p cliptype-app
          cargo clippy --locked --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app -- -D warnings
      - name: Verify Windows workspace
        run: |
          cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
          cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Enforce P3 shortcut invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'trigger_hotkey = "ctrl+alt+shift+v"' packaging/windows/install.ps1
          grep -F 'cancel_hotkey = "ctrl+alt+shift+x"' packaging/windows/install.ps1
          ! grep -R --line-number --fixed-strings 'HotkeyPreset' \
            crates/cliptype-core/src/lib.rs \
            crates/cliptype-core/src/settings.rs \
            crates/cliptype-windows/src \
            apps/cliptype/src \
            packaging/windows \
            docs/CONFIGURATION.md
          grep -F 'parse_legacy_hotkey' crates/cliptype-app/src/settings.rs
      - name: Remove one-time implementation files
        run: |
          git rm .github/patches/p3-01.patch.gz.b64
          git rm .github/patches/hotkey.rs.gz.b64
          git rm .github/workflows/p3-01-apply.yml
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P3-01: add custom hotkey contracts and migrate settings"
          git push origin HEAD:feat/p3-01-hotkey-contracts
