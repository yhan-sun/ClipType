name: Bootstrap Code Typo Beta6

on:
  push:
    branches:
      - fix/code-mode-typos-beta6
    paths:
      - .github/cliptype-code-typo-beta6-trigger

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply reviewed beta6 patch
        run: python3 .github/scripts/apply_code_typo_beta6.py

      - name: Normalize Code typo let-chain for Clippy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/cliptype-app/src/coordinator.rs')
          text = path.read_text(encoding='utf-8')
          old_head = "\n".join([
              "        if let KeyboardAction::Atom(atom) = action {",
              "            if let Some(wrong) =",
          ]) + "\n"
          new_head = "\n".join([
              "        if let KeyboardAction::Atom(atom) = action",
              "            && let Some(wrong) =",
          ]) + "\n"
          if text.count(old_head) != 1:
              raise SystemExit('expected one Code typo let-chain head')
          text = text.replace(old_head, new_head, 1)

          old_tail = "\n".join([
              "            }",
              "        }",
              "",
              "        if matches!(",
          ])
          new_tail = "\n".join([
              "        }",
              "",
              "        if matches!(",
          ])
          if text.count(old_tail) != 1:
              raise SystemExit('expected one Code typo let-chain tail')
          path.write_text(text.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'fn code_adjacent_typo' crates/cliptype-app/src/coordinator.rs
          grep -q 'KeyboardAction::Backspace' crates/cliptype-app/src/coordinator.rs
          grep -q '^v0.2.0-beta.6$' release/VERSION
          grep -q '^version: 0.2.0-beta.6+5$' apps/cliptype-flutter/pubspec.yaml
          test -f docs/releases/v0.2.0-beta.6.md
          test ! -e .github/scripts/apply_code_typo_beta6.py
          test ! -e .github/workflows/bootstrap-code-typo-beta6.yml
          test ! -e .github/cliptype-code-typo-beta6-trigger

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Native-neutral Rust candidate gate
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          git diff --check
          cargo +1.98.0 test --locked -p cliptype-core -p cliptype-platform -p cliptype-app
          cargo +1.98.0 clippy --locked --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app -- -D warnings

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: support corrected typos in Code mode"
          git push origin HEAD:fix/code-mode-typos-beta6
