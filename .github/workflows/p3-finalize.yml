name: P3 Finalize And Open PR

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-finalize.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: p3-cross-platform-finalize
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FEATURE_BRANCH: feat/p3-cross-platform-ui-macos

jobs:
  finalize:
    name: Verify macOS, Universal 2, and open implementation PR
    runs-on: macos-15-arm64
    timeout-minutes: 60
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0

      - name: Select, validate, and extract staged source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          root = Path('.github/p3-stage2')
          expected_encoded = '8f8b42b20fe1ec0a47052992f78ff8705e343cf76947f07b6fe676d6960460a3'
          expected_payload = 'a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9'
          expected_length = 28116
          tail = (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )

          def normalized(path: Path) -> str:
              value = ''.join(path.read_text(encoding='ascii').split())
              if re.fullmatch(r'[A-Za-z0-9+/]*={0,2}', value) is None:
                  raise ValueError(f'non-Base64 character: {path.name}')
              return value

          candidates = []
          subchunk_names = [
              'chunk-00.b64', 'chunk-01.b64',
              'chunk-02a.b64', 'chunk-02b.b64',
              'chunk-02c.b64', 'chunk-02d.b64',
              'chunk-03.b64', 'chunk-04.b64', 'chunk-05.b64',
              'chunk-06.b64', 'chunk-07.b64',
          ]
          if all((root / name).is_file() for name in subchunk_names):
              candidates.append((
                  'verified-subchunks',
                  ''.join(normalized(root / name) for name in subchunk_names) + tail,
              ))

          large_chunk_names = [f'chunk-{index:02d}.b64' for index in range(8)]
          if all((root / name).is_file() for name in large_chunk_names):
              candidates.append((
                  'large-chunks',
                  ''.join(normalized(root / name) for name in large_chunk_names) + tail,
              ))

          monolith = root / 'payload.b64'
          if monolith.is_file():
              try:
                  candidates.append(('monolith', normalized(monolith)))
              except (UnicodeError, ValueError):
                  pass

          diagnostics = []
          selected = None
          for name, encoded in candidates:
              encoded_digest = hashlib.sha256(encoded.encode('ascii')).hexdigest()
              diagnostics.append(
                  f'{name}: chars={len(encoded)} encoded_sha256={encoded_digest}'
              )
              if len(encoded) != expected_length or encoded_digest != expected_encoded:
                  continue
              try:
                  payload = base64.b64decode(encoded, validate=True)
              except ValueError as error:
                  diagnostics.append(f'{name}: decode_error={type(error).__name__}')
                  continue
              payload_digest = hashlib.sha256(payload).hexdigest()
              diagnostics.append(
                  f'{name}: bytes={len(payload)} payload_sha256={payload_digest}'
              )
              if payload_digest == expected_payload:
                  selected = (name, payload)
                  break

          Path('/tmp/p3-stage2-integrity.txt').write_text(
              '\n'.join(diagnostics) + '\n', encoding='utf-8'
          )
          if selected is None:
              raise SystemExit('no staged payload candidate passed aggregate integrity gates')
          name, payload = selected
          with Path('/tmp/p3-stage2-integrity.txt').open('a', encoding='utf-8') as handle:
              handle.write(f'selected={name}\n')
          Path('/tmp/p3-stage2.tar.gz').write_bytes(payload)
          PY
          tar -tzf /tmp/p3-stage2.tar.gz | tee /tmp/p3-stage2-members.txt
          tar -xzf /tmp/p3-stage2.tar.gz
          chmod +x packaging/macos/package.sh

      - name: Normalize generated source and workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cargo = Path('apps/cliptype-macos/Cargo.toml')
          text = cargo.read_text(encoding='utf-8').replace(
              'name = "cliptype-macos"\n',
              'name = "cliptype-macos-app"\n',
              1,
          )
          if '[[bin]]' not in text:
              text += '\n[[bin]]\nname = "cliptype-macos"\npath = "src/main.rs"\n'
          cargo.write_text(text, encoding='utf-8')

          native = Path('crates/cliptype-macos/native/cliptype_macos.m')
          text = native.read_text(encoding='utf-8')
          text = text.replace(
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
          )
          text = text.replace(
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
          )
          native.write_text(text, encoding='utf-8')

          rust = Path('crates/cliptype-macos/src/lib.rs')
          text = rust.read_text(encoding='utf-8')
          text = text.replace('#![forbid(unsafe_code)]', '#![deny(unsafe_op_in_unsafe_fn)]')
          text = text.replace('\nextern "C" {\n', '\nunsafe extern "C" {\n')
          rust.write_text(text, encoding='utf-8')

          for workflow in [
              Path('.github/workflows/p3-cross-platform.yml'),
              Path('.github/workflows/macos-release.yml'),
          ]:
              text = workflow.read_text(encoding='utf-8')
              text = text.replace('-p cliptype-macos --target', '-p cliptype-macos-app --target')
              text = text.replace(
                  'runner: macos-15\n            target: x86_64-apple-darwin',
                  'runner: macos-15-intel\n            target: x86_64-apple-darwin',
              )
              text = text.replace(
                  'runs-on: macos-15\n    timeout-minutes: 20',
                  'runs-on: macos-15-intel\n    timeout-minutes: 20',
              )
              text = text.replace(
                  '--repo "$GITHUB_REPOSITORY" --clobber=false',
                  '--repo "$GITHUB_REPOSITORY"',
              )
              workflow.write_text(text, encoding='utf-8')
          PY

      - name: Install pinned Rust toolchain and targets
        shell: bash
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin

      - name: Format, lock, and validate repository text
        shell: bash
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Check, test, and lint Apple Silicon workspace
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target aarch64-apple-darwin 2>&1 | tee /tmp/macos-arm-check.log
          cargo test --workspace --target aarch64-apple-darwin 2>&1 | tee /tmp/macos-arm-test.log
          cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings 2>&1 | tee /tmp/macos-arm-clippy.log

      - name: Check Intel macOS workspace
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-intel-check.log

      - name: Build and validate Universal 2 executable
        shell: bash
        run: |
          set -o pipefail
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin 2>&1 | tee /tmp/macos-arm-build.log
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin 2>&1 | tee /tmp/macos-intel-build.log
          mkdir -p /tmp/p3-universal
          lipo -create \
            target/aarch64-apple-darwin/release/cliptype-macos \
            target/x86_64-apple-darwin/release/cliptype-macos \
            -output /tmp/p3-universal/cliptype-macos
          lipo -verify_arch arm64 x86_64 /tmp/p3-universal/cliptype-macos
          lipo -info /tmp/p3-universal/cliptype-macos | tee /tmp/macos-universal-info.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-finalize-diagnostics
          path: |
            /tmp/p3-stage2-integrity.txt
            /tmp/p3-stage2-members.txt
            /tmp/macos-*.log
          if-no-files-found: warn
          retention-days: 2

      - name: Remove one-time implementation transport
        shell: bash
        run: |
          git rm -rf .github/p3-stage2
          if [[ -f .github/workflows/p3-stage2-apply.yml ]]; then
            git rm .github/workflows/p3-stage2-apply.yml
          fi
          git rm .github/workflows/p3-finalize.yml

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "P3: add cross-platform settings UI and macOS app"
          git push origin HEAD:${FEATURE_BRANCH}

      - name: Open or update P3 implementation PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$FEATURE_BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          cat >"$body_file" <<'EOF'
          ## Summary

          Delivers the P3 cross-platform product slice:

          - shared Slint settings UI for Windows and macOS;
          - versioned settings and transactional custom trigger/cancel hotkeys;
          - Windows live hotkey replacement with conflict probing;
          - macOS clipboard, target, keyboard, paste, permission, login-item, hotkey, and menu-bar adapters;
          - macOS menu-bar composition root;
          - Universal 2 build and packaging automation;
          - cross-platform CI and protected signed/notarized release workflow.

          ## Safety and privacy invariants

          - no clipboard history or persistence of clipboard plaintext;
          - no global key logging or low-level keyboard hook;
          - target evidence remains content-blind;
          - trigger/cancel replacement is all-or-nothing;
          - failed shortcut registration preserves the previous live pair;
          - macOS Accessibility is requested only through an explicit user action;
          - public signed/notarized release remains gated on maintainer-provided Apple credentials.

          ## Automated verification completed before this PR was opened

          - Rust formatting and lockfile regeneration;
          - Apple Silicon workspace check, tests, and Clippy with warnings denied;
          - Intel macOS workspace cross-check;
          - release builds for arm64 and x86_64;
          - `lipo` Universal 2 architecture verification;
          - prior Stage 1 native-neutral tests and complete Windows cross-check.

          ## Manual validation still required before public macOS release

          - controlled Accessibility permission flow on a maintainer Mac;
          - focus-change and Secure Event Input behavior in representative applications;
          - Developer ID signing, notarization, stapling, and Gatekeeper assessment with protected credentials.
          EOF
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --title "P3: cross-platform settings UI and macOS menu-bar app" \
              --body-file "$body_file"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$FEATURE_BRANCH" \
              --title "P3: cross-platform settings UI and macOS menu-bar app" \
              --body-file "$body_file"
          fi
