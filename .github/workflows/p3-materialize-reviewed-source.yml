name: P3 Materialize Reviewed Source

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths: [".github/workflows/p3-materialize-reviewed-source.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    name: Commit reviewed macOS source and remove transport automation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and extract the unique CRC-complete archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path('.github/p3-stage2')
          names = [
              'chunk-00.b64', 'chunk-01.b64',
              'chunk-02a.b64', 'chunk-02b.b64', 'chunk-02c.b64', 'chunk-02d.b64',
              'chunk-03.b64',
              'chunk-04a.b64', 'chunk-04b.b64', 'chunk-04c.b64', 'chunk-04d.b64',
              'chunk-05a.b64', 'chunk-05b.b64', 'chunk-05c.b64', 'chunk-05d.b64',
              'chunk-06.b64', 'chunk-07.b64',
          ]
          tail = (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )
          encoded = ''.join(''.join((root / name).read_text(encoding='ascii').split()) for name in names) + tail
          assert len(encoded) == 28116
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == '8f8b42b20fe1ec0a47052992f78ff8705e343cf76947f07b6fe676d6960460a3'
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == 'a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9'
          uncompressed = gzip.decompress(payload)
          assert hashlib.sha256(uncompressed).hexdigest() == '344ae75f5f289cca03b5a4448e0985dae5dcfd97ca2faa81c62a53c4bebaa61a'

          destination = Path('/tmp/p3-reviewed-tree')
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(uncompressed), mode='r:') as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk() or member.isdev():
                      raise RuntimeError(f'unsafe archive member: {member.name}')
                  if not (member.isdir() or member.isfile()):
                      raise RuntimeError(f'unsupported archive member: {member.name}')
                  if member.isfile():
                      stream = archive.extractfile(member)
                      if stream is None or len(stream.read()) != member.size:
                          raise RuntimeError(f'incomplete archive member: {member.name}')
              archive.extractall(destination, members=members, filter='data')
          print(f'extracted_members={len(members)}')
          PY
      - name: Replace transport-only state with reviewed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/p3-*
          rm -f .github/scripts/materialize_p3.py
          rm -f .github/workflows/p3-*.yml
          cp -a /tmp/p3-reviewed-tree/. .
          chmod +x packaging/macos/package.sh
          python3 - <<'PY'
          from pathlib import Path

          # GitHub's macos-15 label is arm64 in the current hosted image fleet.
          # Use the explicit Intel label for x86_64 and macos-15 for arm64.
          for path in (Path('.github/workflows/p3-cross-platform.yml'), Path('.github/workflows/macos-release.yml')):
              text = path.read_text(encoding='utf-8')
              text = text.replace('runner: macos-15\n            target: x86_64-apple-darwin', 'runner: macos-15-intel\n            target: x86_64-apple-darwin')
              text = text.replace('runner: macos-15-xlarge\n            target: aarch64-apple-darwin', 'runner: macos-15\n            target: aarch64-apple-darwin')
              text = text.replace('runs-on: macos-15\n    timeout-minutes: 20', 'runs-on: macos-15\n    timeout-minutes: 20')
              path.write_text(text, encoding='utf-8')

          rust = Path('crates/cliptype-macos/src/lib.rs')
          text = rust.read_text(encoding='utf-8')
          text = text.replace('#![forbid(unsafe_code)]', '#![deny(unsafe_op_in_unsafe_fn)]')
          rust.write_text(text, encoding='utf-8')

          native = Path('crates/cliptype-macos/src/native.rs')
          text = native.read_text(encoding='utf-8').replace('\nextern "C" {\n', '\nunsafe extern "C" {\n')
          native.write_text(text, encoding='utf-8')
          PY
          test -f crates/cliptype-macos/src/native.rs
          test -f apps/cliptype-macos/src/main.rs
          test -x packaging/macos/package.sh
          test -f .github/workflows/p3-cross-platform.yml
          test -f .github/workflows/macos-release.yml
          ! find .github -maxdepth 2 -type f -name 'p3-*-apply.yml' -print -quit | grep -q .
      - name: Install Linux UI dependencies and pinned Rust
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Normalize and verify native-neutral source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Cross-check complete Windows workspace
        shell: bash
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc
      - name: Ensure the PR diff contains source, not transport payloads
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github -maxdepth 2 -type d -name 'p3-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f \( -name 'p3-final*' -o -name 'p3-pr-*' -o -name 'p3-stage*' -o -name 'p3-payload*' -o -name 'p3-materialize*' -o -name 'p3-machine*' -o -name 'p3-macos-repair*' -o -name 'p3-promote*' -o -name 'p3-unpack*' \) -print -quit)"
          git status --short
      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "P3: materialize macOS product source and permanent CI"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
