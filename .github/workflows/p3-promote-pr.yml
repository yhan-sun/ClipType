name: P3 Promote Draft PR After Green Gate

on:
  push:
    branches: [feat/p3-cross-platform-ui-macos]
    paths:
      - ".github/p3-green/platform-gate.txt"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FEATURE_BRANCH: feat/p3-cross-platform-ui-macos

jobs:
  promote:
    name: Promote P3 PR only with valid all-platform proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0
      - name: Validate immutable proof
        shell: bash
        run: |
          set -euo pipefail
          proof=.github/p3-green/platform-gate.txt
          test -f "$proof"
          verified_sha="$(sed -n 's/^verified_sha=//p' "$proof")"
          test -n "$verified_sha"
          grep -qx 'shared=success' "$proof"
          grep -qx 'windows=success' "$proof"
          grep -qx 'macos_arm64=success' "$proof"
          grep -qx 'macos_x86_64=success' "$proof"
          grep -qx 'universal2=success' "$proof"
          git cat-file -e "${verified_sha}^{commit}"
          git merge-base --is-ancestor "$verified_sha" HEAD
      - name: Create or promote P3 implementation PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$FEATURE_BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          cat >"$body_file" <<'EOF'
          ## Summary

          Implements the P3 cross-platform product slice:

          - shared native Slint settings UI;
          - versioned settings and transactional custom trigger/cancel shortcuts;
          - Windows live shortcut replacement with native registration probing;
          - macOS clipboard, target, Unicode keyboard, paste, permission, login-item, shortcut, and menu-bar adapters;
          - macOS menu-bar composition root;
          - Universal 2 build and packaging automation;
          - protected signed/notarized macOS release workflow.

          ## Safety and privacy invariants

          - clipboard plaintext is not persisted or logged;
          - no global key logger or low-level keyboard hook is introduced;
          - target identity remains content-blind;
          - shortcut replacement is all-or-nothing and preserves the prior live pair on failure;
          - Accessibility prompting requires explicit user action;
          - public signed/notarized release remains gated on protected maintainer credentials.

          ## Automated gate

          This PR is Ready only because `.github/p3-green/platform-gate.txt` proves the implementation commit passed shared Rust/UI checks, the complete Windows workspace, native macOS arm64, native macOS x86_64, and Universal 2 `lipo` verification.

          ## Manual release validation still required

          - controlled Accessibility authorization/revocation on a maintainer Mac;
          - focus-change and Secure Event Input behavior in representative applications;
          - Developer ID signing, notarization, stapling, and Gatekeeper assessment with protected credentials.
          EOF
          if [[ -z "$number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$FEATURE_BRANCH" \
              --title "P3: cross-platform settings UI and macOS menu-bar app" \
              --body-file "$body_file"
          else
            gh pr edit "$number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "P3: cross-platform settings UI and macOS menu-bar app" \
              --body-file "$body_file"
            if [[ "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "true" ]]; then
              gh pr ready "$number" --repo "$GITHUB_REPOSITORY"
            fi
          fi
