name: P3 Windows Product Gate

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/cliptype-core/**"
      - "crates/cliptype-platform/**"
      - "crates/cliptype-app/**"
      - "crates/cliptype-ui/**"
      - "crates/cliptype-windows/**"
      - "apps/cliptype/**"
      - "assets/branding/**"
      - ".github/workflows/p3-cross-platform.yml"
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/**"
      - "assets/branding/**"
      - ".github/workflows/p3-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows UI and custom hotkeys
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format, check, test, and lint
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows product
        run: cargo build --release --locked -p cliptype
