name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  p2-b02-apply:
    name: Apply P2-B02 source transformation
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/p2-windows-productization'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - name: Check out exact P2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p2-windows-productization
          fetch-depth: 0
      - name: Refuse unexpected lineage
        shell: bash
        run: |
          set -euo pipefail
          expected="b728314093c107078d877cc3c2e85024dac864a3"
          git merge-base --is-ancestor "$expected" HEAD
          test -f .github/scripts/p2_b02_patch.py
      - name: Apply reviewed transformation
        run: python .github/scripts/p2_b02_patch.py
      - name: Install pinned Rust toolchain and Windows check target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-pc-windows-msvc --toolchain 1.98.0
      - name: Format transformed source
        run: cargo +1.98.0 fmt --all
      - name: Validate native-neutral crates
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 check --locked --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app
          cargo +1.98.0 test --locked -p cliptype-core -p cliptype-platform -p cliptype-app
          cargo +1.98.0 clippy --locked --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app -- -D warnings
      - name: Cross-check complete Windows workspace
        run: cargo +1.98.0 check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
      - name: Restore CI and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git checkout b728314093c107078d877cc3c2e85024dac864a3 -- .github/workflows/ci.yml
          rm .github/scripts/p2_b02_patch.py
          rm .github/scripts/p2_b02_patch.py.part{1,2,3,4}
          rm .github/workflows/p2-b02-apply.yml
      - name: Commit transformed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P2-B02: add reliable per-action human typing controls"
          git push origin HEAD:feat/p2-windows-productization

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check

  native-neutral:
    name: Native-neutral crates (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Record Rust host
        run: rustc --version --verbose
      - name: Check native-neutral crates
        run: cargo check --locked --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app
      - name: Test native-neutral crates
        run: cargo test --locked -p cliptype-core -p cliptype-platform -p cliptype-app
      - name: Lint native-neutral crates
        run: cargo clippy --locked --all-targets -p cliptype-core -p cliptype-platform -p cliptype-app -- -D warnings

  windows-workspace:
    name: Windows workspace
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Record Rust host
        run: rustc --version --verbose
      - name: Inspect workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
