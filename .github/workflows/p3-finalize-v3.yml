name: P3 Native-Hardened Final Gate

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CFLAGS_aarch64_apple_darwin: -fobjc-arc -fmodules -Wno-deprecated-declarations
  CFLAGS_x86_64_apple_darwin: -fobjc-arc -fmodules -Wno-deprecated-declarations

concurrency:
  group: p3-stage2-recovery
  cancel-in-progress: true

jobs:
  finalize:
    name: Harden native source, verify all targets, and open P3 PR
    runs-on: macos-15-arm64
    timeout-minutes: 80
    steps:
      - name: Check out exact P3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0

      - name: Recover checked production source when absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f crates/cliptype-macos/Cargo.toml && -f apps/cliptype-macos/Cargo.toml ]]; then
            echo "Using committed production source"
            exit 0
          fi
          test -d .github/p3-stage2
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.github/p3-stage2')
          names = [
              'chunk-00.b64', 'chunk-01.b64',
              'chunk-02a.b64', 'chunk-02b.b64',
              'chunk-02c.b64', 'chunk-02d.b64',
              'chunk-03.b64', 'chunk-04.b64', 'chunk-05.b64',
              'chunk-06.b64', 'chunk-07.b64',
          ]
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          encoded_parts = []
          for name in names:
              text = (root / name).read_text(encoding='ascii').strip()
              if not text or not set(text) <= alphabet:
                  raise SystemExit(f'invalid payload piece: {name}')
              encoded_parts.append(text)
          encoded = ''.join(encoded_parts) + (
              '4Drd+CKu/EUUrwBBLNrmBfXcYGX+zb/5N//m3/ybf/Nv/s2/+Tf/5t/8m3'
              '/zb/7Nv/k3/+bf/Jt/82/+zb/5N//m3/ybf/Nv/n2d7/8Dz2yswwC4AQA='
          )
          if len(encoded) != 28116:
              raise SystemExit(f'Base64 length mismatch: {len(encoded)}')
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != '8f8b42b20fe1ec0a47052992f78ff8705e343cf76947f07b6fe676d6960460a3':
              raise SystemExit('Base64 SHA-256 mismatch')
          payload = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(payload).hexdigest() != 'a97a86588b32216988062a58d19c9ad49e5b3f2077764059468fca6bbf9737f9':
              raise SystemExit('archive SHA-256 mismatch')
          Path('/tmp/p3-stage2.tar.gz').write_bytes(payload)
          PY
          tar -tzf /tmp/p3-stage2.tar.gz | tee /tmp/p3-v3-members.log
          tar -xzf /tmp/p3-stage2.tar.gz
          chmod +x packaging/macos/package.sh

      - name: Normalize manifests and Rust 2024 FFI syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          app_manifest = Path('apps/cliptype-macos/Cargo.toml')
          text = app_manifest.read_text(encoding='utf-8')
          text = text.replace('name = "cliptype-macos"\n', 'name = "cliptype-macos-app"\n', 1)
          if '[[bin]]' not in text:
              text += '\n[[bin]]\nname = "cliptype-macos"\npath = "src/main.rs"\n'
          app_manifest.write_text(text, encoding='utf-8')

          for path in list(Path('crates/cliptype-macos').rglob('*.rs')) + list(Path('apps/cliptype-macos').rglob('*.rs')):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'(?m)^(\s*)extern\s+"C"\s*\{', r'\1unsafe extern "C" {', text)
              text = text.replace('#[no_mangle]', '#[unsafe(no_mangle)]')
              path.write_text(text, encoding='utf-8')

          native = Path('crates/cliptype-macos/native/cliptype_macos.m')
          text = native.read_text(encoding='utf-8')
          duplicate_function = (
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
              'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n'
          )
          while duplicate_function in text:
              text = text.replace(
                  duplicate_function,
                  'int ct_macos_post_unicode(const uint16_t *units, size_t length) {\n',
              )
          duplicate_image = (
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
              '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n'
          )
          while duplicate_image in text:
              text = text.replace(
                  duplicate_image,
                  '        image = [NSImage imageWithSystemSymbolName:@"doc.on.clipboard"\n',
              )
          native.write_text(text, encoding='utf-8')
          PY

      - name: Harden macOS build script and permanent workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          build = Path('crates/cliptype-macos/build.rs')
          text = build.read_text(encoding='utf-8')
          marker = 'fn main() {'
          if marker not in text:
              raise SystemExit('macOS build.rs has no main function')
          prelude_lines = []
          if 'CARGO_CFG_TARGET_OS' not in text:
              prelude_lines.extend([
                  '    if std::env::var("CARGO_CFG_TARGET_OS").as_deref() != Ok("macos") {',
                  '        return;',
                  '    }',
              ])
          frameworks = ['AppKit', 'ApplicationServices', 'Carbon', 'ServiceManagement']
          for framework in frameworks:
              directive = f'cargo:rustc-link-lib=framework={framework}'
              if directive not in text:
                  prelude_lines.append(
                      f'    println!("cargo:rustc-link-lib=framework={framework}");'
                  )
          if prelude_lines:
              text = text.replace(marker, marker + '\n' + '\n'.join(prelude_lines), 1)
          if '-fobjc-arc' not in text and 'cc::Build' in text:
              text = text.replace(
                  'cc::Build::new()',
                  'cc::Build::new().flag("-fobjc-arc").flag("-fmodules")',
                  1,
              )
          build.write_text(text, encoding='utf-8')

          cross_platform = Path('.github/workflows/p3-cross-platform.yml')
          text = cross_platform.read_text(encoding='utf-8')
          text = text.replace('-p cliptype-macos --target', '-p cliptype-macos-app --target')
          text = text.replace(
              'runner: macos-15\n            target: x86_64-apple-darwin',
              'runner: macos-15-intel\n            target: x86_64-apple-darwin',
          )
          cross_platform.write_text(text, encoding='utf-8')

          release = Path('.github/workflows/macos-release.yml')
          text = release.read_text(encoding='utf-8')
          text = text.replace('-p cliptype-macos --target', '-p cliptype-macos-app --target')
          text = text.replace(
              'runs-on: macos-15\n    timeout-minutes: 20',
              'runs-on: macos-15-intel\n    timeout-minutes: 20',
          )
          text = text.replace('--repo "$GITHUB_REPOSITORY" --clobber=false', '--repo "$GITHUB_REPOSITORY"')
          release.write_text(text, encoding='utf-8')
          PY

      - name: Install Rust 1.98 and validation targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.0 \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc
          rustup default 1.98.0

      - name: Apply Clang and Rust fix-its
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx clang \
            -x objective-c \
            -fobjc-arc \
            -fmodules \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -fsyntax-only \
            -Wno-deprecated-declarations \
            -Xclang -fixit \
            crates/cliptype-macos/native/cliptype_macos.m || true
          cargo fmt --all
          cargo generate-lockfile
          cargo fix --workspace --all-targets --target aarch64-apple-darwin \
            --allow-dirty --allow-staged --allow-no-vcs --broken-code || true
          cargo clippy --fix --workspace --all-targets --target aarch64-apple-darwin \
            --allow-dirty --allow-staged --allow-no-vcs --broken-code -- -D warnings || true
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Objective-C syntax hard gate
        shell: bash
        run: |
          set -o pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx clang \
            -x objective-c \
            -fobjc-arc \
            -fmodules \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -fsyntax-only \
            -Wall -Wextra -Werror \
            -Wno-deprecated-declarations \
            -Wno-unused-parameter \
            crates/cliptype-macos/native/cliptype_macos.m \
            2>&1 | tee /tmp/p3-v3-objc.log

      - name: Native Apple Silicon hard gate
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-v3-arm64-check.log
          cargo test --workspace --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-v3-arm64-test.log
          cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings 2>&1 | tee /tmp/p3-v3-arm64-clippy.log

      - name: Intel macOS and Windows hard gates
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/p3-v3-x64-check.log
          cargo check --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 | tee /tmp/p3-v3-windows-check.log

      - name: Universal 2 hard gate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin
          mkdir -p target/universal2/release
          lipo -create \
            target/aarch64-apple-darwin/release/cliptype-macos \
            target/x86_64-apple-darwin/release/cliptype-macos \
            -output target/universal2/release/cliptype-macos
          lipo -verify_arch arm64 x86_64 target/universal2/release/cliptype-macos
          lipo -info target/universal2/release/cliptype-macos | tee /tmp/p3-v3-universal2.log

      - name: Upload native-hardening diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-native-hardened-final-gate-diagnostics
          path: /tmp/p3-v3-*.log
          if-no-files-found: warn
          retention-days: 3

      - name: Persist safe fix-its after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps crates packaging .github/workflows/p3-cross-platform.yml .github/workflows/macos-release.yml
          if git diff --cached --quiet; then
            echo "No safe fix-it change is available to persist"
          else
            git commit -m "fix(p3): apply native macOS compiler fix-its"
            git push origin HEAD:feat/p3-cross-platform-ui-macos
          fi

      - name: Commit verified production source and remove temporary gates
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch .github/p3-stage2
          git rm -f --ignore-unmatch \
            .github/workflows/p3-stage2-apply.yml \
            .github/workflows/p3-stage2-recovery.yml \
            .github/workflows/p3-stage2-recovery-v2.yml \
            .github/workflows/p3-pr-gate.yml \
            .github/workflows/p3-pr-gate-retry.yml \
            .github/workflows/p3-finalize-and-pr.yml \
            .github/workflows/p3-finalize-v2.yml \
            .github/workflows/p3-finalize-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "P3: add macOS adapters, menu-bar app, and Universal 2 CI"
          git push origin HEAD:feat/p3-cross-platform-ui-macos

      - name: Open or report P3 implementation pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head feat/p3-cross-platform-ui-macos --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "P3 implementation PR already open: #$existing"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head feat/p3-cross-platform-ui-macos \
              --title "P3: shared settings UI, custom hotkeys, and macOS support" \
              --body "Implements the shared Slint settings UI, transactional custom hotkeys, native macOS adapters and AppKit menu-bar composition root, and Universal 2 packaging/release gates. Verified by Objective-C syntax checks, native Apple Silicon tests and Clippy, Intel macOS and Windows MSVC cross-checks, and lipo architecture validation."
          fi
