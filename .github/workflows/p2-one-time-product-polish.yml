name: P2 One-Time Product Polish

on:
  push:
    branches:
      - feat/p2-windows-productization

permissions:
  contents: write

jobs:
  finalize-product-subsystem:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest productization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p2-windows-productization
          fetch-depth: 0
      - name: Apply idempotent release-subsystem guard
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/cliptype/src/main.rs")
          text = path.read_text(encoding="utf-8")
          marker = '#![cfg_attr(all(windows, not(debug_assertions)), windows_subsystem = "windows")]'
          if marker not in text:
              text = marker + "\n\n" + text
              path.write_text(text, encoding="utf-8")
      - name: Format, remove transient workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo fmt --all
          rm -f .github/workflows/p2-one-time-format.yml
          rm -f .github/workflows/p2-one-time-cleanup.yml
          rm -f .github/workflows/p2-one-time-product-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: finalize P2 Windows GUI subsystem and formatting"
          for attempt in 1 2 3; do
            if git push origin HEAD:feat/p2-windows-productization; then
              exit 0
            fi
            git pull --rebase origin feat/p2-windows-productization
          done
          exit 1
