name: Apply Code Navigation Fix

on:
  push:
    branches:
      - fix/code-navigation-modifier-isolation

permissions:
  contents: write

concurrency:
  group: apply-code-navigation-modifier-isolation
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/code-navigation-modifier-isolation

      - name: Require expected staging base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 683f7ab54f21d0881f2ef1c01ce7edd920a8eaa8 HEAD
          test -f .github/code-fix/apply.py

      - name: Apply reviewed fix payload
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/code-fix/apply.py
          python3 -m py_compile scripts/verify_code_navigation.py scripts/verify_bridge_completion.py
          git diff --check

      - name: Remove one-time staging helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/code-fix
          rm -f .github/workflows/apply-code-navigation-fix.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: isolate macOS code navigation modifiers"
          git push origin HEAD:fix/code-navigation-modifier-isolation
