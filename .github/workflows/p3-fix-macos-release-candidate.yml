name: P3 Fix macOS Release Candidate

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
    paths:
      - ".github/workflows/p3-fix-macos-release-candidate.yml"

permissions:
  contents: write

jobs:
  repair:
    name: Repair exact macOS candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply reviewed corrective patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("apps/cliptype-macos/src/main.rs")
          text = main.read_text(encoding="utf-8")
          old = "        const fn label(self) -> &'static str {"
          new = "        pub(super) const fn label(self) -> &'static str {"
          if old not in text and new not in text:
              raise SystemExit("HostError::label signature not found")
          text = text.replace(old, new, 1)
          main.write_text(text, encoding="utf-8")

          native = Path("crates/cliptype-macos/src/native.rs")
          lines = native.read_text(encoding="utf-8").splitlines()
          removed = False
          output = []
          for line in lines:
              if not removed and line.strip() == "Arc,":
                  removed = True
                  continue
              output.append(line)
          if not removed and any(line.strip() == "Arc," for line in output):
              raise SystemExit("unused Arc import could not be removed")
          native.write_text("\n".join(output) + "\n", encoding="utf-8")

          gate = Path(".github/workflows/p3-real-host-evidence.yml")
          gate_text = gate.read_text(encoding="utf-8")
          marker = "  PYTHONDONTWRITEBYTECODE: 1\n"
          cache = "  PYTHONPYCACHEPREFIX: /tmp/cliptype-p3-pycache\n"
          if cache not in gate_text:
              if marker not in gate_text:
                  raise SystemExit("real-host workflow env marker not found")
              gate_text = gate_text.replace(marker, marker + cache, 1)
          gate.write_text(gate_text, encoding="utf-8")
          PY

          cargo fmt --all -- --check
          git diff --check

      - name: Commit repaired candidate and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p3-fix-macos-release-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            apps/cliptype-macos/src/main.rs \
            crates/cliptype-macos/src/native.rs \
            .github/workflows/p3-real-host-evidence.yml \
            .github/workflows/p3-fix-macos-release-candidate.yml
          git diff --cached --check
          git commit -m "fix(p3): repair macOS build and clean release preflight"
          git push origin HEAD:feat/p3-cross-platform-ui-macos
