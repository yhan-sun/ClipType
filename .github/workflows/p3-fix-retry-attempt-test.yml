name: P3 One-Time Retry Attempt Test Fix

on:
  push:
    branches: [fix/p3-macos-candidate-compile-8c52a74]
    paths: [".github/workflows/p3-fix-retry-attempt-test.yml"]

permissions:
  contents: write

env:
  EXPECTED_PARENT: d0e99501403147218db06866a45df60ffad59390

jobs:
  patch:
    name: Make retry-attempt exhaustion deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch, test, scope-check, and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/cliptype-app/tests/coordinator.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let keyboard = FakeKeyboard::complete(trace);
          let coordinator = Coordinator::new(
              clipboard.clone(),
              target,
              keyboard,
              FakeModifier::clear(),
              config(2),
          )
          .expect("coordinator");

          assert!(matches!(
              coordinator.trigger(),
              TriggerResult::Started { .. }
          ));
          wait(&coordinator);

          assert_eq!(clipboard.calls(), 4);
'''
          new = '''    let keyboard = FakeKeyboard::complete(trace);
          let mut retry_attempt_config = config(2);
          // This case verifies the attempt bound, not the independent wall-clock
          // bound. A wide window prevents slower CI hosts from legitimately
          // exhausting the time budget before the fourth attempt.
          retry_attempt_config.clipboard_retry = RetryBudget::new(
              RetryAttemptLimit::new(4).expect("test retry count"),
              Duration::from_secs(1),
          )
          .expect("test retry window");
          let coordinator = Coordinator::new(
              clipboard.clone(),
              target,
              keyboard,
              FakeModifier::clear(),
              retry_attempt_config,
          )
          .expect("coordinator");

          assert!(matches!(
              coordinator.trigger(),
              TriggerResult::Started { .. }
          ));
          wait(&coordinator);

          assert_eq!(clipboard.calls(), 4);
'''
          if text.count(old) != 1:
              raise RuntimeError('unexpected retry exhaustion test source')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked -p cliptype-app --test coordinator \
            clipboard_retry_exhaustion_is_a_preparation_failure
          git rm .github/workflows/p3-fix-retry-attempt-test.yml
          mapfile -t changed < <(git status --short --untracked-files=all | sed -E 's/^...//' | sort)
          [[ ${#changed[@]} -eq 2 ]]
          [[ "${changed[0]}" == ".github/workflows/p3-fix-retry-attempt-test.yml" ]]
          [[ "${changed[1]}" == "crates/cliptype-app/tests/coordinator.rs" ]]
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(p3): separate retry attempt and time budgets"
          git push origin HEAD:fix/p3-macos-candidate-compile-8c52a74
