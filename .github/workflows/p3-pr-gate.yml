name: P3 Verified Pull Request Gate

on:
  push:
    branches:
      - feat/p3-cross-platform-ui-macos
    paths:
      - ".github/workflows/p3-pr-gate.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: p3-verified-pr-gate
  cancel-in-progress: true

jobs:
  verify-and-open:
    name: Verify committed P3 source and open PR
    runs-on: macos-15-arm64
    timeout-minutes: 60
    steps:
      - name: Check out exact P3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-cross-platform-ui-macos
          fetch-depth: 0

      - name: Require committed production source and no staging payload
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/cliptype-macos/Cargo.toml
          test -f apps/cliptype-macos/Cargo.toml
          test -f packaging/macos/package.sh
          test -f .github/workflows/p3-cross-platform.yml
          test -f .github/workflows/macos-release.yml
          test ! -e .github/p3-stage2
          test ! -e .github/workflows/p3-stage2-apply.yml
          test ! -e .github/workflows/p3-stage2-recovery.yml
          test ! -e .github/workflows/p3-stage2-recovery-v2.yml

      - name: Install Rust 1.98 and validation targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.0 \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc
          rustup default 1.98.0

      - name: Verify formatting and lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock
          git diff --check

      - name: Native Apple Silicon tests and lint
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-pr-arm64-check.log
          cargo test --workspace --target aarch64-apple-darwin 2>&1 | tee /tmp/p3-pr-arm64-test.log
          cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings 2>&1 | tee /tmp/p3-pr-arm64-clippy.log

      - name: Intel macOS and Windows cross-checks
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --target x86_64-apple-darwin 2>&1 | tee /tmp/p3-pr-x64-check.log
          cargo check --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 | tee /tmp/p3-pr-windows-check.log

      - name: Verify Universal 2 composition
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p cliptype-macos-app --target aarch64-apple-darwin
          cargo build --release -p cliptype-macos-app --target x86_64-apple-darwin
          mkdir -p target/universal2/release
          lipo -create \
            target/aarch64-apple-darwin/release/cliptype-macos \
            target/x86_64-apple-darwin/release/cliptype-macos \
            -output target/universal2/release/cliptype-macos
          lipo -verify_arch arm64 x86_64 target/universal2/release/cliptype-macos
          lipo -info target/universal2/release/cliptype-macos | tee /tmp/p3-pr-universal2.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-pr-gate-diagnostics
          path: /tmp/p3-pr-*.log
          if-no-files-found: warn
          retention-days: 2

      - name: Remove one-time PR gate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p3-pr-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(p3): remove verified pull request gate"
          git push origin HEAD:feat/p3-cross-platform-ui-macos

      - name: Open or report P3 pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/p3-pr.md <<'EOF'
          ## Summary

          - shared Slint settings UI with versioned, content-safe persistence
          - transactional platform-neutral trigger/cancel hotkeys with live Win32 replacement
          - native macOS clipboard, keyboard, paste, target, permission, and global-hotkey adapters
          - AppKit menu-bar application and launch-at-login integration
          - Universal 2 packaging and credential-gated signing/notarization release workflow

          ## Automated validation

          - Rust 1.98 formatting and deterministic lockfile
          - native Apple Silicon workspace check, tests, and Clippy with warnings denied
          - Intel macOS full workspace cross-check
          - Windows MSVC full workspace cross-check
          - arm64 and x86_64 release builds combined and verified as Universal 2

          ## Release boundary

          Developer ID signing and Apple notarization require protected maintainer credentials. Ordinary PR validation builds and verifies unsigned candidates but does not claim notarization.
          EOF
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head feat/p3-cross-platform-ui-macos \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "P3 pull request already open: #$existing"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head feat/p3-cross-platform-ui-macos \
              --title "P3: shared settings UI, custom hotkeys, and macOS support" \
              --body-file /tmp/p3-pr.md
          fi
